name: rsh-013-control-keys

on:
  push:
    branches:
      - agent/rsh-013-canonical-track-schema
    paths:
      - .github/workflows/rsh-013-control-keys.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rsh-013-canonical-track-schema
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Normalize canonical control keys
        run: node scripts/fix-rsh-013-control-keys.mjs
      - name: Commit normalized keys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No normalization changes"; exit 1; }
          git commit -m "RSH-013: normalize canonical control keys"
          git push origin HEAD:agent/rsh-013-canonical-track-schema
