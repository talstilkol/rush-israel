name: rsh014-identity-remediate

on:
  push:
    branches:
      - agent/rsh-014-track-modules

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[rsh014-identity-remediated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci

      - name: Restore identities and disambiguate facade from modular index
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/game/tracks.ts",
              'import type { SkyPreset, TrackDef, TrackId, Weather } from "./types";',
              'import type { CityId, SkyPreset, TrackDef, TrackId, Weather } from "./types";',
          )
          replace_once(
              "src/game/tracks/shared.ts",
              'import type { CityId } from "../types";',
              'import type { CityId, SkyPreset, TrackDef, TrackId, Weather } from "../types";',
          )

          replace_once(
              "scripts/check-track-consumer-source-pin.mjs",
              '''function normalizeResolvedModulePath(modulePath) {
            return modulePath
              .replace(/\\.(?:[cm]?[jt]sx?)$/u, "")
              .replace(/\\/index$/u, "");
          }
          ''',
              '''function normalizeResolvedModulePath(modulePath) {
            return modulePath.replace(/\\.(?:[cm]?[jt]sx?)$/u, "");
          }
          ''',
          )
          replace_once(
              "scripts/check-track-consumer-source-pin.mjs",
              '''function resolvesToTrackModule(filePath, moduleName) {
            return normalizedModulePath(filePath, moduleName) === "src/game/tracks";
          }
          ''',
              '''function resolvesToTrackModule(filePath, moduleName) {
            const resolved = normalizedModulePath(filePath, moduleName);
            if (resolved === "src/game/tracks/index") {
              // The canonical facade is independently pinned by TRACK-MODULE-MANIFEST.json.
              // Other direct imports of the modular index remain protected consumers.
              return filePath !== "src/game/tracks.ts";
            }
            return resolved === "src/game/tracks";
          }
          ''',
          )

          marker = '''test("type-only imports do not expand the runtime consumer authority", () => {
          '''
          insertion = '''test("the canonical facade may import the modular index without becoming an external consumer", () => {
            const sources = readConsumerSources();
            sources["src/game/tracks.ts"] =
              'import { TRACKS } from "./tracks/index";\\nexport { TRACKS };\\n';
            const result = validateTrackConsumerSourcePin({ consumerSources: sources });
            assert.deepEqual(result.errors, []);
            assert.deepEqual(result.consumers, CONSUMER_PATHS);
          });

          '''
          test_path = Path("scripts/check-track-consumer-source-pin.test.mjs")
          test_text = test_path.read_text()
          if insertion in test_text:
              raise SystemExit("facade/index regression test already exists")
          if test_text.count(marker) != 1:
              raise SystemExit("type-only test marker is not unique")
          test_path.write_text(test_text.replace(marker, insertion + marker, 1))
          PY

          git diff --check

      - name: Run exact failing-test regression set
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/check-track-module-manifest.test.mjs \
            scripts/check-track-consumer-source-pin.test.mjs \
            scripts/check-track-schema-hardening.test.mjs \
            scripts/check-track-schema.test.mjs \
            scripts/check-track-source-pin.test.mjs

      - name: Commit exact remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rsh014-identity-remediate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RSH-014: restore pinned source identities [rsh014-identity-remediated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
