name: RSH-015 exact worktree snapshot

on:
  push:
    branches:
      - agent/rsh-015-world-core
    paths:
      - .github/workflows/rsh015-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Package exact worktree
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/rush-israel-rsh015-worktree.tar.gz .
          sha256sum /tmp/rush-israel-rsh015-worktree.tar.gz > /tmp/rush-israel-rsh015-worktree.tar.gz.sha256

      - name: Upload exact worktree artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsh015-worktree-${{ github.sha }}
          path: |
            /tmp/rush-israel-rsh015-worktree.tar.gz
            /tmp/rush-israel-rsh015-worktree.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/rsh015-snapshot.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RSH-015: remove temporary snapshot workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
