name: RSH-015 apply Codex review fix

on:
  push:
    branches:
      - agent/rsh-015-world-core
    paths:
      - .github/workflows/rsh015-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact review-fix staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Apply and validate exact Codex review fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "60ebe860e5f1d3214f540cd836f8e3f3070226b2"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("MASTER-PLAN.md"): (
                  "ACTIVE — RSH-013–RSH-015 accepted; RSH-016 deferred/not authorised",
                  "DEFERRED — RSH-013–RSH-015 accepted; RSH-016 deferred/not authorised",
              ),
              Path("MILESTONE-REGISTER.md"): (
                  "ACTIVE — RSH-013–RSH-015 accepted; RSH-016 not authorised",
                  "DEFERRED — RSH-013–RSH-015 accepted; RSH-016 not authorised",
              ),
              Path("scripts/milestone-register.test.mjs"): (
                  "ACTIVE — RSH-013–RSH-015 accepted; RSH-016 not authorised",
                  "DEFERRED — RSH-013–RSH-015 accepted; RSH-016 not authorised",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one review-fix target, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          node scripts/check-governance-contract.mjs
          node --test scripts/milestone-register.test.mjs scripts/program-control.test.mjs
          node scripts/check-world-core.mjs
          node scripts/check-track-consumer-source-pin.mjs
          git diff --check
          rm .github/workflows/rsh015-review-fix.yml
          git add MASTER-PLAN.md MILESTONE-REGISTER.md scripts/milestone-register.test.mjs .github/workflows/rsh015-review-fix.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          test "$(git diff --cached --name-only | grep -Ev '^(MASTER-PLAN\.md|MILESTONE-REGISTER\.md|scripts/milestone-register\.test\.mjs|\.github/workflows/rsh015-review-fix\.yml)$' | wc -l)" -eq 0
          test "$(git write-tree)" = "27e88997f6127a045b0c260850cabcf0c0d650fd"

      - name: Commit exact Codex review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(rsh-015): keep architecture milestone deferred"
          git push origin "HEAD:${{ github.ref_name }}"
