name: rsh-020-apply

on:
  push:
    branches:
      - agent/rsh-020-template-dependency-isolation
    paths:
      - .github/workflows/rsh-020-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Decode and verify exact implementation
        run: |
          cat .rsh020-apply.00 .rsh020-apply.01 .rsh020-apply.02 .rsh020-apply.03 | base64 -d | gzip -d > scripts/rsh020-apply.mjs
          test "$(sha256sum scripts/rsh020-apply.mjs | cut -d' ' -f1)" = "ee9573ec883439bf3dd130035dafaa58b6baa7ade07007e3eba5e19058d7e298"
          rm .rsh020-apply.00 .rsh020-apply.01 .rsh020-apply.02 .rsh020-apply.03
          node --check scripts/rsh020-apply.mjs

      - name: Prepare RSH-020 implementation
        run: node scripts/rsh020-apply.mjs prepare

      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Seal RSH-020 authorities
        run: node scripts/rsh020-apply.mjs finalize

      - name: Update milestone contract tests
        run: |
          cat > scripts/milestone-register.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { test } from "node:test";
          import { fromRoot } from "./project-root.mjs";

          function readRegister() { return readFileSync(fromRoot("MILESTONE-REGISTER.md"), "utf8"); }

          test("milestone register records the consumed RSH-020 authority exactly", () => {
            const register = readRegister();
            assert.match(register, /\*\*Version:\*\* 7\.0\.0/);
            assert.match(register, /merge of the RSH-020 pull request/);
            assert.match(register, /Next scheduled unit:\*\* RSH-021 — deferred and not authorised/);
            assert.match(register, /\| M3 \| Architecture decomposition \| RSH-013–RSH-020 \| 8 \| ACCEPTED/);
            assert.match(register, /\| Accepted units \| 20 \|/);
            assert.match(register, /\| Remaining units \| 47 \|/);
            assert.match(register, /\| RSH-020 one-unit authority \| consumed 1\/1 \|/);
            assert.match(register, /\| RSH-019 \| Resource ownership and leak accounting accepted \|/);
            assert.match(register, /\| RSH-020 \| Auth\/DB\/multiplayer\/template isolation and 74→30 direct package reduction accepted on validated merge \|/);
            assert.match(register, /No RSH-021 branch, PR or implementation structure is authorised/);
          });

          test("milestone register contains no stale RSH-020 execution authority", () => {
            const register = readRegister();
            assert.doesNotMatch(register, /Next scheduled unit:\*\* RSH-020/);
            assert.doesNotMatch(register, /\| Accepted units \| 19 \|/);
            assert.doesNotMatch(register, /\| Remaining units \| 48 \|/);
            assert.doesNotMatch(register, /RSH-020 not authorised/);
            assert.doesNotMatch(register, /RSH-020 requires a new explicit owner instruction/);
          });
          EOF

      - name: Install exact reduced dependency tree
        run: npm ci

      - name: Run complete unit-test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Validate dependency boundary
        run: npm run check:dependencies

      - name: Validate patch hygiene
        run: git diff --check

      - name: Commit exact validated implementation
        run: |
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git add -A
          git commit -m "RSH-020: isolate unused template dependencies"
          git push origin HEAD:agent/rsh-020-template-dependency-isolation
