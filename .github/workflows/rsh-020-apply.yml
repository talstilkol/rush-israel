name: rsh-020-apply

on:
  push:
    branches:
      - agent/rsh-020-template-dependency-isolation
    paths:
      - .github/workflows/rsh-020-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Decode and verify exact implementation
        run: |
          cat .rsh020-apply.00 .rsh020-apply.01 .rsh020-apply.02 .rsh020-apply.03 | base64 -d | gzip -d > scripts/rsh020-apply.mjs
          test "$(sha256sum scripts/rsh020-apply.mjs | cut -d' ' -f1)" = "ee9573ec883439bf3dd130035dafaa58b6baa7ade07007e3eba5e19058d7e298"
          rm .rsh020-apply.00 .rsh020-apply.01 .rsh020-apply.02 .rsh020-apply.03
          node --check scripts/rsh020-apply.mjs

      - name: Prepare RSH-020 implementation
        run: node scripts/rsh020-apply.mjs prepare

      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Seal RSH-020 authorities
        run: node scripts/rsh020-apply.mjs finalize

      - name: Install exact reduced dependency tree
        run: npm ci

      - name: Run complete unit-test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Validate dependency boundary
        run: npm run check:dependencies

      - name: Validate patch hygiene
        run: git diff --check

      - name: Commit exact validated implementation
        run: |
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git add -A
          git commit -m "RSH-020: isolate unused template dependencies"
          git push origin HEAD:agent/rsh-020-template-dependency-isolation
