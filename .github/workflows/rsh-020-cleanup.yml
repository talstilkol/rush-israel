name: rsh-020-cleanup

on:
  push:
    branches:
      - agent/rsh-020-template-dependency-isolation
    paths:
      - .github/workflows/rsh-020-cleanup.yml

permissions:
  contents: write

jobs:
  clean-and-validate:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Remove generated output and harden ignore boundary
        run: |
          git rm -r --ignore-unmatch .vercel
          grep -qxF '.vercel/' .gitignore || printf '\n.vercel/\n' >> .gitignore
          rm .github/workflows/rsh-020-cleanup.yml

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install exact reduced dependency tree
        run: npm ci

      - name: Run complete unit-test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Validate dependency boundary
        run: npm run check:dependencies

      - name: Prove generated output cannot enter the final tree
        run: |
          rm -rf .vercel dist .output
          git add -A
          test -z "$(git ls-files .vercel)"
          test -z "$(git ls-files '.github/workflows/rsh-020-*')"
          git diff --cached --check

      - name: Commit exact clean candidate
        run: |
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git commit -m "RSH-020: remove generated output from candidate tree"
          git push origin HEAD:agent/rsh-020-template-dependency-isolation
