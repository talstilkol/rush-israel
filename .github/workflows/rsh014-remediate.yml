name: rsh014-remediate

on:
  push:
    branches:
      - agent/rsh-014-track-modules

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[rsh014-remediated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply exact RSH-014 remediation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "scripts/check-track-module-manifest.test.mjs",
              '  assert.match(validateTrackModuleManifest({ bundle: reordered }).errors.join("\\n"), /manifest differs|IDs/order|path/ordinal/);',
              '  assert.match(validateTrackModuleManifest({ bundle: reordered }).errors.join("\\n"), /manifest differs|IDs\\/order|path\\/ordinal/);',
          )

          replace_once(
              "scripts/check-track-schema-core.mjs",
              'import { readCanonicalTrackSource } from "./load-track-modules.mjs";\nimport { readCanonicalTrackSource } from "./load-track-modules.mjs";\n',
              'import { readCanonicalTrackSource } from "./load-track-modules.mjs";\n',
          )

          stale_source_pin_input = '    sourcePin: JSON.parse(readFileSync(fromRoot("TRACK-SOURCE-PIN.json"), "utf8")),\n'
          for path in (
              "scripts/check-track-consumer-source-pin.test.mjs",
              "scripts/check-track-type-source-pin.test.mjs",
          ):
              replace_once(path, stale_source_pin_input, "")

          replace_once(
              "scripts/check-track-source-pin.mjs",
              'import { readFileSync, realpathSync } from "node:fs";',
              'import { realpathSync } from "node:fs";',
          )
          replace_once(
              "scripts/check-track-source-pin.mjs",
              'import { fromRoot } from "./project-root.mjs";\n',
              '',
          )
          replace_once(
              "scripts/check-track-source-pin.mjs",
              'import { readCanonicalTrackSource } from "./load-track-modules.mjs";',
              'import { validateTrackModuleManifest } from "./check-track-module-manifest.mjs";',
          )

          source_pin_path = Path("scripts/check-track-source-pin.mjs")
          source_pin_text = source_pin_path.read_text()
          marker = "if (isMainModule(import.meta.url)) {"
          if source_pin_text.count(marker) != 1:
              raise SystemExit("scripts/check-track-source-pin.mjs: main block marker is not unique")
          source_pin_text = source_pin_text[:source_pin_text.index(marker)] + '''if (isMainModule(import.meta.url)) {
            const result = validateTrackModuleManifest();
            if (result.errors.length) {
              console.error(
                "track-module-manifest replacement fail\\n"
                + result.errors.map((error) => `- ${error}`).join("\\n"),
              );
              process.exit(1);
            }
            console.log(
              `track-source-pin compatibility ok: replaced by ${result.moduleCount} track modules; reconstructed ${EXPECTED_TRACK_SOURCE_PATH} ${result.legacyBlob}`,
            );
          }
          '''
          source_pin_path.write_text(source_pin_text)

          replace_once(
              "scripts/check-track-module-manifest.mjs",
              'import { readdirSync, readFileSync, realpathSync } from "node:fs";',
              'import { readdirSync, realpathSync } from "node:fs";',
          )
          replace_once(
              "scripts/check-track-schema-definition-guard.test.mjs",
              'import { readFileSync } from "node:fs";\n',
              '',
          )
          replace_once(
              "scripts/check-track-schema-definition-guard.test.mjs",
              'import { fromRoot } from "./project-root.mjs";\n',
              '',
          )
          replace_once(
              "src/game/tracks.ts",
              'import type { CityId, SkyPreset, TrackDef, TrackId, Weather } from "./types";',
              'import type { SkyPreset, TrackDef, TrackId, Weather } from "./types";',
          )
          replace_once(
              "src/game/tracks/shared.ts",
              'import type { CityId, SkyPreset, TrackDef, TrackId, Weather } from "../types";',
              'import type { CityId } from "../types";',
          )

          stale_reader = 'readFileSync(fromRoot("TRACK-SOURCE-PIN.json"'
          readers = [
              str(path)
              for path in Path("scripts").glob("*.mjs")
              if stale_reader in path.read_text()
          ]
          if readers:
              raise SystemExit("stale TRACK-SOURCE-PIN.json readers remain: " + ", ".join(readers))
          PY

          rm -f .github/workflows/rsh014-remediate.yml
          git diff --check

      - name: Commit exact remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RSH-014: close CI and source-pin reader gaps [rsh014-remediated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
