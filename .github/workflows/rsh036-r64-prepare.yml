name: rsh036-r64-prepare
on:
  push:
    branches: [agent/rsh-036-r64-validation-20260905]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply hash-pinned candidate with no preparation files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,os,subprocess
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'inspect.mjs').write_bytes(Path('.rsh036-r64-inspect.mjs').read_bytes())
          patch=lzma.decompress(Path('.rsh036-r64-part1').read_bytes()+Path('.rsh036-r64-part2').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='c923d73517f153ec689eb7fc8150fb6841abe37c2efe24fcc9155588bfaa5dd2'
          target=tmp/'candidate.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','59b71fccf137296697017e04eef19eef998ac597'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='2b883a551a70ffb557295ddf7604fd4adc570ab5',tree
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/candidate.patch').write_bytes(patch)
          Path('artifacts/candidate-tree.txt').write_text(tree+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Governance and complete unit suite
        run: |
          set -o pipefail
          node scripts/check-governance-contract.mjs 2>&1 | tee artifacts/governance.log
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Full QA and locked typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: Actual browser water-clock cycles and resource recovery
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store only validated tree objects, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='2b883a551a70ffb557295ddf7604fd4adc570ab5'
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==19
          assert all(not p.startswith('.github/workflows/') and not p.startswith('.rsh036-') for p in paths)
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          data=json.dumps({'base_tree':'a39852f1d72e0ab91f5a07e05b17c97904f87ca4','tree':entries}).encode()
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as resp:result=json.load(resp)
          assert result['sha']==tree,result
          Path('artifacts/validated-tree.json').write_text(json.dumps({'tree':tree,'changed_files':19,'ref_mutations':0,'unit_accepted':False,'run_id':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
          PY
      - name: Read-only scene diagnostic on same candidate
        run: |
          set -o pipefail
          cp "$RUNNER_TEMP/inspect.mjs" artifacts/inspect.mjs
          node scripts/run-with-server.mjs -- node artifacts/inspect.mjs 2>&1 | tee artifacts/scene-diagnostic.log
      - name: Unchanged golden gate; never update baselines
        run: |
          set -o pipefail
          test -z "$UPDATE_GOLDEN"
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsh036-r64-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
