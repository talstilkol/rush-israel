name: rsh036-r64-foliage-validation
on:
  push:
    branches: [agent/rsh-036-r64-validation-20260905]
permissions:
  contents: write
jobs:
  validate-foliage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact candidate without temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,os,subprocess
          patch=lzma.decompress(Path('.rsh036-r64-foliage.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='41f4ec106127777988b30111ae80cf8958852077cffabb44dd04d63e9be785d8'
          target=Path(os.environ['RUNNER_TEMP'])/'foliage.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','c7b6bbcd3fea034cc0f872b397134231ec8dc410'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='093a1c6c9152dcfc37d2cb751ff77d2d45087f03',tree
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/candidate.patch').write_bytes(patch)
          Path('artifacts/candidate-tree.txt').write_text(tree+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Governance and all unit cases
        run: |
          set -o pipefail
          node scripts/check-governance-contract.mjs 2>&1 | tee artifacts/governance.log
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Full QA and typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: Actual recovered Rothschild scene, complete canopy, water cycles and failure recovery
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated tree objects only; never branch updates or acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='093a1c6c9152dcfc37d2cb751ff77d2d45087f03'
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==18
          assert all(not p.startswith('.github/workflows/') and not p.startswith('.rsh036-') for p in paths)
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          data=json.dumps({'base_tree':'ed50b69e1694b6468b4fd7c2ff8f4feb40c2f33a','tree':entries}).encode()
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as resp:result=json.load(resp)
          assert result['sha']==tree,result
          Path('artifacts/validated-tree.json').write_text(json.dumps({'tree':tree,'changed_files':18,'ref_mutations':0,'unit_accepted':False,'run_id':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
          PY
      - name: Original golden comparisons remain mandatory; no baseline updates
        run: |
          set -o pipefail
          test -z "$UPDATE_GOLDEN"
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsh036-r64-foliage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
