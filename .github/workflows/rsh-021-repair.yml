name: RSH-021 rejected-source preservation repair

on:
  push:
    branches:
      - agent/rsh-021-save-schema-migrations

permissions:
  contents: write

concurrency:
  group: rsh-021-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact RSH-021 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rsh-021-save-schema-migrations
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Apply rejected-source preservation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          save_path = Path("src/game/save.ts")
          save_source = save_path.read_text()
          old_write = '''function write(data: SaveData) {
            const storage = browserStorage();'''
          new_write = '''function write(data: SaveData) {
            // A rejected read owns the source bytes until RSH-022 provides an explicit
            // recovery decision. Automatic flushes and setters must not destroy them.
            if (lastSaveStatus.state === "rejected") return false;
            const storage = browserStorage();'''
          if save_source.count(old_write) != 1:
              raise SystemExit("save write boundary not found exactly once")
          save_path.write_text(save_source.replace(old_write, new_write))

          schema_path = Path("src/game/save-schema.ts")
          schema_source = schema_path.read_text()
          unused = '''const KEY = SAVE_KEY;
          const LEGACY = LEGACY_SAVE_KEY;

          '''
          if schema_source.count(unused) != 1:
              raise SystemExit("unused save-key aliases not found exactly once")
          schema_path.write_text(schema_source.replace(unused, ""))

          test_path = Path("scripts/check-save-schema.test.mjs")
          test_source = test_path.read_text()
          test_name = 'test("the save facade never overwrites rejected source bytes during automatic flush"'
          if test_name in test_source:
              raise SystemExit("rejected-source regression test already exists")
          test_source += '''

          test("the save facade never overwrites rejected source bytes during automatic flush", async () => {
            const prior = Object.getOwnPropertyDescriptor(globalThis, "localStorage");
            const raw = "{invalid-json";
            const storage = memoryStorage({ [SAVE_KEY]: raw });
            Object.defineProperty(globalThis, "localStorage", {
              configurable: true,
              writable: true,
              value: storage,
            });
            try {
              const facade = await import("../src/game/save.ts");
              facade.flushSave();
              assert.equal(facade.getSaveStatus().state, "rejected");
              assert.equal(facade.getSaveStatus().errorCode, "invalid-json");
              assert.equal(storage.values.get(SAVE_KEY), raw);
              facade.setMutedSave(true);
              assert.equal(storage.values.get(SAVE_KEY), raw);
            } finally {
              if (prior) Object.defineProperty(globalThis, "localStorage", prior);
              else delete globalThis.localStorage;
            }
          });
          '''
          test_path.write_text("\n".join(line.rstrip() for line in test_source.splitlines()) + "\n")

          old_schema = "8fafa377d2712a799eb466d36085d31f9840e0a22927334b13dc5e929fd3986d"
          old_facade = "c0b7715aa5b533465de7f140630a1cf527ee5d8560374b6f87af06d4a16852ef"
          old_test = "2ac86e7da358a312f12b2515b8e480c7f76b2a9802e4d513ac3b974259242975"
          old_manifest = "e36b41e3cf8043f19f0974ad0852603fad2d24c135c62780ea8c649f8b3888e3"
          new_schema = sha256(schema_path.read_bytes()).hexdigest()
          new_facade = sha256(save_path.read_bytes()).hexdigest()
          new_test = sha256(test_path.read_bytes()).hexdigest()

          def replace_tracked(old: str, new: str) -> None:
              result = subprocess.run(
                  ["git", "grep", "-l", "--", old],
                  text=True,
                  capture_output=True,
              )
              if result.returncode not in (0, 1):
                  raise SystemExit(result.stderr)
              paths = [Path(line) for line in result.stdout.splitlines() if line]
              if not paths:
                  raise SystemExit(f"accepted identity not found: {old}")
              for path in paths:
                  source = path.read_text()
                  path.write_text(source.replace(old, new))

          replace_tracked(old_schema, new_schema)
          replace_tracked(old_facade, new_facade)
          replace_tracked(old_test, new_test)

          manifest_path = Path("SAVE-SCHEMA-MANIFEST.json")
          new_manifest = sha256(manifest_path.read_bytes()).hexdigest()
          replace_tracked(old_manifest, new_manifest)

          Path(".github/workflows/rsh-021-repair.yml").unlink()
          print({
              "schema_source_sha256": new_schema,
              "save_facade_sha256": new_facade,
              "test_source_sha256": new_test,
              "manifest_sha256": new_manifest,
          })
          PY
          git add -A
          git diff --cached --check
          ! git grep -n "8fafa377d2712a799eb466d36085d31f9840e0a22927334b13dc5e929fd3986d"
          ! git grep -n "c0b7715aa5b533465de7f140630a1cf527ee5d8560374b6f87af06d4a16852ef"
          ! git grep -n "2ac86e7da358a312f12b2515b8e480c7f76b2a9802e4d513ac3b974259242975"
          ! git grep -n "e36b41e3cf8043f19f0974ad0852603fad2d24c135c62780ea8c649f8b3888e3"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run rejected-source regression and save authority tests
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --test scripts/check-save-schema.test.mjs

      - name: Validate save-schema authority
        run: node scripts/check-save-schema.mjs

      - name: Run complete unit-test suite
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Verify exact final-tree boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test ! -e .github/workflows/rsh-021-repair.yml
          test ! -e .rsh021-payload
          test ! -e .github/workflows/rsh-021-apply.yml
          test ! -e scripts/rsh021-apply.mjs
          test ! -e RSH-022-PREFLIGHT.json
          test ! -e src/game/save-recovery
          test "$(git rev-parse origin/main)" = "7cff508a4cfa95c03ac34c5503912e70bed47b90"
          node scripts/check-save-schema.mjs

      - name: Commit and push corrected RSH-021 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git commit -m "RSH-021: preserve rejected save source bytes"
          git push origin HEAD:agent/rsh-021-save-schema-migrations
