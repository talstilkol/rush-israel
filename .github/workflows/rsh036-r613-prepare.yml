name: rsh036-r613-air-clock-diagnosis
on:
  push:
    branches: [agent/rsh-036-r613-validation-20260907]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse exact verified candidate preparation without executing its validation or writes
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          diagnostic=Path('.r613-air-diagnostic.mjs').read_bytes()
          workflow=subprocess.check_output(['git','show','5586dbe341680cb701a38a41ba195445e035d11b:.github/workflows/rsh036-r613-prepare.yml'],text=True)
          body=workflow.split('      - name: Apply exact candidate and reconcile one stale audit count\n        run: |\n',1)[1].split('      - uses:',1)[0]
          script='\n'.join(line[10:] for line in body.splitlines())
          subprocess.run(['bash','-e','-c',script],check=True)
          Path('.r613-air-diagnostic.mjs').write_bytes(diagnostic)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='ecf736ff767a18ddb1d3339e01a072dc72c5d6b9'
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Three actual wall-clock and deterministic-clock comparisons, no product changes
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node .r613-air-diagnostic.mjs 2>&1 | tee artifacts/air-clock.log
          git diff --exit-code
      - name: Preserve evidence, never publish a product tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r613-air-diagnosis-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
