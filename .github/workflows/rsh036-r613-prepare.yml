name: rsh036-r613-drive-diagnosis
on:
  push:
    branches: [agent/rsh-036-r613-validation-20260907]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover verified candidate, never publish it
        run: |
          python - <<'PY'
          import lzma,hashlib,json,os,subprocess
          from pathlib import Path
          raw=lzma.decompress(b''.join(Path(f'.r613-transfer-{i}').read_bytes() for i in range(3)))
          assert hashlib.sha256(raw).hexdigest()=='63f4c87108607636576f98d9672601a021b1df975a1c7b20d5dbef8ce19f3e30'
          d=json.loads(raw);Path(os.environ['RUNNER_TEMP'],'r613.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',d['base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==d['base_tree']
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Instrument existing unchanged drive sequence without accepting failures
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/drive-smoke.mjs').read_text()
          source=source.replace('import { chromium } from "playwright";','import { chromium } from "playwright";\nimport { mkdir, writeFile } from "node:fs/promises";\nlet diagnosticError = null;')
          source=source.replace('await p.goto(url,', 'try {\nawait p.goto(url,',1)
          anchor='await p.waitForFunction(() => !!window.__controlsTest, { timeout: 35000 });'
          assert source.count(anchor)==1
          source=source.replace(anchor,anchor+'''
          await p.evaluate(() => {
            const t=window.__controlsTest;
            window.__driveTrace=[];
            const snap=(event,args=[])=>window.__driveTrace.push({event,args,x:t.getX(),y:t.getY(),z:t.getZ(),yaw:t.getYaw(),speed:t.getSpeed(),damage:t.getDamage(),on:t.getOnTrack(),airborne:t.getAirborne(),steer:t.getSteer(),mix:t.getKinMix()});
            for (const key of ['advanceTime','resetStart','setSteer','setThrottle']) {
              const original=t[key]; t[key]=(...args)=>{const value=original(...args);snap(key,args);return value;};
            }
            snap('begin');
          });
          ''')
          assert source.count('await b.close();')==1
          source=source.replace('await b.close();','''
          } catch(error) { diagnosticError=String(error); }
          finally {
            const trace=await p.evaluate(()=>window.__driveTrace??[]).catch(()=>[]);
            const report={authority:false,protocol:'Unmodified legacy drive sequence and assertions; read-only50ms state trace; diagnostics, not acceptance',tag:process.env.DIAG_TAG,scriptError:diagnosticError,pageErrors:errs,trace};
            await mkdir('artifacts/drive-diagnosis',{recursive:true});
            await writeFile(`artifacts/drive-diagnosis/${process.env.DIAG_TAG}.json`,JSON.stringify(report,null,2)+'\\n');
            console.log(JSON.stringify({tag:report.tag,error:diagnosticError,frames:trace.length,last:trace.at(-1)}));
            await b.close();
          }
          ''')
          Path('.r613-drive-diag.mjs').write_text(source)
          PY
      - name: Three original-source full sequence diagnoses
        run: |
          for trial in 1 2 3; do DIAG_TAG=old-$trial node scripts/run-with-server.mjs -- node .r613-drive-diag.mjs; done
          git diff --exit-code
      - name: Switch only to exact candidate
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          d=json.loads(Path(os.environ['RUNNER_TEMP'],'r613.json').read_text())
          subprocess.run(['git','apply','--index','-'],input=d['patch'].encode(),check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==d['tree']
          PY
      - name: Three candidate full sequence diagnoses
        run: |
          for trial in 1 2 3; do DIAG_TAG=new-$trial node scripts/run-with-server.mjs -- node .r613-drive-diag.mjs; done
          git diff --exit-code
      - name: Preserve diagnosis, not acceptance or publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r613-drive-diagnosis-${{ github.run_id }}
          path: artifacts/drive-diagnosis/**
          if-no-files-found: error
          retention-days: 14
