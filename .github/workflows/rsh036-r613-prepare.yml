name: rsh036-r613-grade-revalidated
on:
  push:
    branches: [agent/rsh-036-r613-validation-20260907]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply three hash-verified candidate patches, no product ref writes
        run: |
          python - <<'PY'
          import json,lzma,hashlib,os,subprocess
          from pathlib import Path
          def read(prefix,count,digest):
            raw=lzma.decompress(b''.join(Path(f'.r613-{prefix}-{i}').read_bytes() for i in range(count)))
            assert hashlib.sha256(raw).hexdigest()==digest
            return json.loads(raw)
          d=read('transfer',3,'63f4c87108607636576f98d9672601a021b1df975a1c7b20d5dbef8ce19f3e30')
          delta=read('delta',2,'810c542614dd64813a7e85c5639238ae45033da246b576a968204043f8dab3ad')
          grade=read('grade',3,'02bb26086a4e30b68eb2bf6e7c52c87c91f1cdca13906c48b81deba18a19eb92')
          subprocess.run(['git','checkout','--detach',d['base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==d['base_tree']
          for patch,digest,tree in [(d['patch'],d['patch_sha256'],d['tree']),(delta['delta_patch'],delta['delta_sha256'],delta['tree'])]:
            assert hashlib.sha256(patch.encode()).hexdigest()==digest
            subprocess.run(['git','apply','--index','-'],input=patch.encode(),check=True)
            assert subprocess.check_output(['git','write-tree'],text=True).strip()==tree
          assert delta['tree']==grade['from_tree']
          Path(os.environ['RUNNER_TEMP'],'vehicle-before-grade.ts').write_bytes(Path('src/game/vehicle.ts').read_bytes())
          assert hashlib.sha256(grade['delta_patch'].encode()).hexdigest()==grade['delta_sha256']
          subprocess.run(['git','apply','--index','-'],input=grade['delta_patch'].encode(),check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==grade['tree']
          subprocess.run(['git','diff','--exit-code'],check=True)
          d.update(grade)
          Path(os.environ['RUNNER_TEMP'],'r613.json').write_text(json.dumps(d))
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/candidate-identity.json').write_text(json.dumps({'base':d['base'],'tree':d['tree'],'changed':d['changed'],'previous_failed_preparations':[34071681721,34072958959]}))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Same16 actual-car grade tests must reproduce14 failures on previous vehicle bytes
        run: |
          python - <<'PY'
          import os,subprocess,re
          from pathlib import Path
          path=Path('src/game/vehicle.ts');final=path.read_bytes()
          try:
            path.write_bytes(Path(os.environ['RUNNER_TEMP'],'vehicle-before-grade.ts').read_bytes())
            result=subprocess.run(['node','--test','scripts/ramp-grade.test.mjs'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            Path('artifacts/grade-before.tap').write_bytes(result.stdout)
            assert result.returncode==1
            for field,count in [('tests',16),('pass',2),('fail',14),('skipped',0),('cancelled',0)]:
              assert re.search(r'^# '+field+r' '+str(count)+r'$',result.stdout.decode(),re.M)
          finally:
            path.write_bytes(final)
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
      - name: Locked parser inventory and governance
        run: |
          cp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          node scripts/dependency-closure.mjs --write
          cmp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          git diff --exit-code
          node scripts/check-governance-contract.mjs
      - name: Complete unit suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint without suppression
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Actual route and moving contacts with projected grade
        env:
          RAMP_CONTACT_OUTPUT: artifacts/contact-new
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/ramp-contact-browser.mjs 2>&1 | tee artifacts/contact-new.log
      - name: Controlled readiness fixtures
        run: node scripts/golden-capture-browser.mjs
      - name: Full QA with restored original combined drive and unchanged five-car acceleration gates
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: All retained actual runtime and resource regressions
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Safe Ayalon capture and steering, no reference writes
        run: |
          set -o pipefail
          npm run qa:ayalon 2>&1 | tee artifacts/ayalon-capture.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated unreferenced tree only, no commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          d=json.loads(Path(os.environ['RUNNER_TEMP'],'r613.json').read_text())
          subprocess.run(['git','diff','--exit-code'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==d['tree']
          entries=[]
          for name in d['changed']:
            assert not name.startswith(('.github/','.r613','/')) and '..' not in Path(name).parts
            entries.append({'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()})
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=json.dumps({'base_tree':d['base_tree'],'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response: result=json.load(response)
          assert result['sha']==d['tree']
          Path('artifacts/prepared-tree.json').write_text(json.dumps({'tree':result['sha'],'ref_writes':0,'commit_writes':0,'merges':0}))
          PY
      - name: Original golden comparison with unchanged images and thresholds
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Preserve actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r613-grade-revalidated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            golden-tmp/**
          if-no-files-found: error
          retention-days: 14
