name: rsh036-r613-recover-exact-candidate
on:
  push:
    branches: [agent/rsh-036-r613-validation-20260907]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover previously hash-verified candidate without any publication
        run: |
          python - <<'PY'
          import subprocess, hashlib, json
          from pathlib import Path
          workflow=subprocess.check_output(['git','show','5586dbe341680cb701a38a41ba195445e035d11b:.github/workflows/rsh036-r613-prepare.yml'],text=True)
          body=workflow.split('      - name: Apply exact candidate and reconcile one stale audit count\n        run: |\n',1)[1].split('      - uses:',1)[0]
          subprocess.run(['bash','-e','-c','\n'.join(line[10:] for line in body.splitlines())],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='ecf736ff767a18ddb1d3339e01a072dc72c5d6b9'
          out=Path('artifacts/recovery');out.mkdir(parents=True)
          patch=subprocess.check_output(['git','diff','--cached','--binary','394a9324dd1fb185335833c12a97b0d71ccc55d2'])
          (out/'candidate.patch').write_bytes(patch)
          (out/'tree.txt').write_bytes(subprocess.check_output(['git','ls-files','-s']))
          (out/'identity.json').write_text(json.dumps({'base':'394a9324dd1fb185335833c12a97b0d71ccc55d2','tree':tree,'patchSha256':hashlib.sha256(patch).hexdigest(),'acceptance':False,'refWrites':0}))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Retain locked dependencies for local verification only
        run: |
          tar -czf artifacts/recovery/locked-node-modules.tar.gz node_modules
          sha256sum artifacts/recovery/locked-node-modules.tar.gz > artifacts/recovery/dependencies.sha256
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r613-recovery-${{ github.run_id }}
          path: artifacts/recovery/**
          if-no-files-found: error
          retention-days: 14
