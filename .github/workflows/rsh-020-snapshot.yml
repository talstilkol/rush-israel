name: rsh-020-snapshot

on:
  push:
    branches:
      - agent/rsh-020-template-dependency-isolation
    paths:
      - .github/workflows/rsh-020-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Archive exact source tree
        run: tar --exclude=.git -czf rsh020-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rsh-020-source-${{ github.run_id }}
          path: rsh020-source.tar.gz
          retention-days: 2
