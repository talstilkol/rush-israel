name: rsh036-r68-finalize-plan
on:
  push:
    branches: [agent/rsh-036-r68-validation-20260906]
permissions:
  contents: write
jobs:
  finalize-plan-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact tested runtime; reconcile two stale plan status strings only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,os,subprocess,urllib.request
          repo='talstilkol/rush-israel';base='46d361365ccde29d528861051f9529c08ec725ab'
          assert os.environ['GITHUB_REPOSITORY']==repo
          patch=lzma.decompress(b''.join(Path(f'.rsh036-r68-part{i:02d}').read_bytes() for i in range(1,4)))
          assert hashlib.sha256(patch).hexdigest()=='669953240f91f34fbb7a06bce1b5a917a1d96c421f42fde7364e054aac6aee00'
          target=Path(os.environ['RUNNER_TEMP'])/'candidate.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='15883b58cfa673e9dfb9befb77d273e8d829cfc0'
          path=Path('MASTER-PLAN-r6.json');text=path.read_text()
          a='local_inventory_and_action_pins_implemented_seven_external_qualifications_open'
          b='local_inventory_action_pins_and_product_boundary_implemented_three_font_qualifications_open'
          c='Generated local closure seals all runtime/build/test/public/golden inputs in declared roots. Potential external resources and mutable action tags remain unqualified.'
          d='Generated local closure seals the declared local runtime/build/test/public/golden surface. Three verified Actions are pinned; all seven external expressions remain recorded, with four dormant vendor-head expressions qualified by the exact product import boundary and three font references unqualified. Overall closure remains false.'
          assert text.count(a)==1 and text.count(c)==1
          path.write_text(text.replace(a,b).replace(c,d))
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['MASTER-PLAN-r6.json']
          data=json.loads(path.read_text());assert data['counts']=={'units':67,'accepted':35,'in_review':1,'remaining':32,'audit_items':18,'legacy_findings':42,'repair_bundles':6}
          subprocess.run(['git','add','MASTER-PLAN-r6.json'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='eb9d45d0ba50e11cbfdcd8b500946ad903a1bc25',tree
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==22 and all(not p.startswith(('.github/','.rsh036-')) for p in paths)
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees',data=json.dumps({'base_tree':'1bf890634b5788298fa6040403ff5dfe3b8b5e3a','tree':entries}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==tree
          Path('artifacts').mkdir(exist_ok=True)
          record={'base_commit':base,'prepared_tree':'15883b58cfa673e9dfb9befb77d273e8d829cfc0','final_tree':tree,'difference_from_preparation':['MASTER-PLAN-r6.json'],'change':'two stale status/limitation strings only; runtime and tests byte-identical','source_validation_run':34006609313,'finalization_run':os.environ['GITHUB_RUN_ID'],'normal_exact_head_ci_required':True,'ref_mutations':0,'merges':0,'accepted':False}
          Path('artifacts/plan-finalization.json').write_text(json.dumps(record,indent=2)+'\n');print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rsh036-r68-plan-finalization-${{ github.run_id }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: error
