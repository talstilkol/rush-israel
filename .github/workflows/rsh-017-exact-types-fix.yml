name: rsh-017-exact-types-fix

on:
  push:
    branches:
      - agent/rsh-017-engine-adapters
    paths:
      - .github/workflows/rsh-017-exact-types-fix.yml

permissions:
  contents: write

env:
  CI: true
  NODE_OPTIONS: --experimental-strip-types

concurrency:
  group: rsh-017-exact-types-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/rsh-017-engine-adapters
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Generate exact typed adapter boundary
        run: |
          sed -i 's/permissive any boundary/permissive value boundary/' scripts/rsh-017-exact-types-fix.mjs
          node scripts/rsh-017-exact-types-fix.mjs

      - name: Reconcile preservation tests and canonical measurements
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("ENGINE-ADAPTER-MANIFEST.json", "utf8"));
          const engine = manifest.extraction.engine;
          const support = manifest.extraction.support;
          const adapterLines = manifest.extraction.adapters.reduce((sum, adapter) => sum + adapter.lines, 0);
          const adapterBytes = manifest.extraction.adapters.reduce((sum, adapter) => sum + adapter.bytes, 0);
          const totalLines = engine.lines + support.lines + adapterLines;
          const totalBytes = engine.bytes + support.bytes + adapterBytes;

          const testPath = "scripts/check-engine-adapters.test.mjs";
          let testSource = readFileSync(testPath, "utf8");
          testSource = testSource.replace(
            '    "return engineLoop.frame.call(this);",\n    "return engineLoop.frame.call({});",',
            '    "return engineLoop.frame.call(engineAdapterHost(this));",\n    "return engineLoop.frame.call({});",',
          );
          writeFileSync(testPath, testSource);

          const controlTestPath = "scripts/program-control.test.mjs";
          let controlTest = readFileSync(controlTestPath, "utf8");
          controlTest = controlTest
            .replace(
              'assert.equal(current.accepted_units["RSH-017"].engine_lines_after, 1202);',
              `assert.equal(current.accepted_units["RSH-017"].engine_lines_after, ${engine.lines});`,
            )
            .replace(
              "assert.equal(engine.extraction.engine.lines, 1202);",
              `assert.equal(engine.extraction.engine.lines, ${engine.lines});`,
            );
          writeFileSync(controlTestPath, controlTest);

          const jsonPaths = [
            "CURRENT-STATE.json",
            "QUEUE.json",
            "BASELINE-REGISTER.json",
            "RSH-017-ENGINE-ADAPTER-PREFLIGHT.json",
          ];
          const replacements = [
            [/"engine_lines_after": 1202/g, `"engine_lines_after": ${engine.lines}`],
            [/"engine_bytes_after": 40417/g, `"engine_bytes_after": ${engine.bytes}`],
            [/"engine_lines": 1202/g, `"engine_lines": ${engine.lines}`],
            [/"engine_bytes": 40417/g, `"engine_bytes": ${engine.bytes}`],
            [/"adapter_lines": 2205/g, `"adapter_lines": ${adapterLines}`],
            [/"adapter_bytes": 76069/g, `"adapter_bytes": ${adapterBytes}`],
            [/"support_lines": 96/g, `"support_lines": ${support.lines}`],
            [/"support_bytes": 6368/g, `"support_bytes": ${support.bytes}`],
            [/"total_engine_source_lines": 3503/g, `"total_engine_source_lines": ${totalLines}`],
            [/"total_engine_source_bytes": 122854/g, `"total_engine_source_bytes": ${totalBytes}`],
          ];
          for (const path of jsonPaths) {
            let source = readFileSync(path, "utf8");
            for (const [pattern, replacement] of replacements) source = source.replace(pattern, replacement);
            JSON.parse(source);
            writeFileSync(path, source);
          }

          console.log(JSON.stringify({
            engineLines: engine.lines,
            engineBytes: engine.bytes,
            adapterLines,
            adapterBytes,
            supportLines: support.lines,
            supportBytes: support.bytes,
            totalLines,
            totalBytes,
          }));
          NODE

      - name: Remove one-shot tooling from final tree
        run: git rm -f .github/workflows/rsh-017-exact-types-fix.yml scripts/rsh-017-exact-types-fix.mjs

      - name: Validate exact type boundary and repository suite
        run: |
          node scripts/check-engine-adapters.mjs
          npm test
          npm run typecheck
          npm run lint

      - name: Commit exact typed boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RSH-017: enforce exact adapter type boundary"
          git push origin HEAD:agent/rsh-017-engine-adapters
