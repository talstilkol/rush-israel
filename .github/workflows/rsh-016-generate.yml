name: rsh-016-generate

on:
  push:
    branches:
      - agent/rsh-016-track-builders
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-016-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[rsh-016-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rsh-016-track-builders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Diagnose generator order boundary
        run: |
          base64 --decode .rsh016/generator.gz.b64 | gzip --decompress > .rsh016/generate.mjs
          grep -n -B 8 -A 12 'top-level world-builder order' .rsh016/generate.mjs
          grep -n -B 6 -A 16 'WORLD_BUILDERS' .rsh016/generate.mjs || true
          grep -n -B 6 -A 16 'registry' .rsh016/generate.mjs | head -160 || true
          exit 1
