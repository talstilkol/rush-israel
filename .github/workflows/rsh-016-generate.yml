name: rsh-016-generate

on:
  push:
    branches:
      - agent/rsh-016-track-builders
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-016-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rsh-016-track-builders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Diagnose generator module and reconstruction ordering
        run: |
          base64 --decode .rsh016/generator.gz.b64 | gzip --decompress > .rsh016/generate.mjs
          sed -n '240,470p' .rsh016/generate.mjs
          exit 1
