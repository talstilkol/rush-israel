name: rsh-016-generate

on:
  push:
    branches:
      - agent/rsh-016-track-builders
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-016-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[rsh-016-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rsh-016-track-builders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Generate isolated track builders
        run: |
          base64 --decode .rsh016/generator.gz.b64 | gzip --decompress > .rsh016/generate.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.rsh016/generate.mjs')
          source = path.read_text()
          replacements = [
            (
              'assert(JSON.stringify(observedIds) === JSON.stringify(trackIds), "top-level world-builder order does not equal runtime track order");',
              'assert(observedIds.length === trackIds.length && new Set(observedIds).size === trackIds.length && trackIds.every((id) => observedIds.includes(id)), "top-level world-builder set does not equal runtime track set");'
            ),
            ('  const id = trackIds[index];', '  const id = observedIds[index];'),
            (
              'const registryImports = moduleRecords.map((record) => `import ${record.function_name} from "./tracks/${record.id}";`).join("\\n");\nconst registryEntries = moduleRecords.map((record) => `  ${JSON.stringify(record.id)}: ${record.function_name},`).join("\\n");',
              'const runtimeModuleRecords = trackIds.map((id, index) => {\n  const record = moduleRecords.find((candidate) => candidate.id === id);\n  assert(record, `runtime-order module ${id} is missing`);\n  return { ...record, ordinal: index + 1, legacy_ordinal: record.ordinal };\n});\nconst registryImports = runtimeModuleRecords.map((record) => `import ${record.function_name} from "./tracks/${record.id}";`).join("\\n");\nconst registryEntries = runtimeModuleRecords.map((record) => `  ${JSON.stringify(record.id)}: ${record.function_name},`).join("\\n");'
            ),
            ('    modules: moduleRecords,', '    modules: runtimeModuleRecords,'),
            ('    function_close_suffix: functionCloseSuffix,', '    function_close_suffix: functionCloseSuffix,\n    legacy_builder_order: observedIds,'),
            (
              '  for (const module of manifest.extraction.modules) {\\n    const moduleSource = readFileSync(fromRoot(...module.path.split("/")), "utf8");',
              '  for (const id of layout.legacy_builder_order) {\\n    const module = manifest.extraction.modules.find((candidate) => candidate.id === id);\\n    if (!module) throw new Error(\`legacy-order world builder \${id} is missing\`);\\n    const moduleSource = readFileSync(fromRoot(...module.path.split("/")), "utf8");'
            ),
          ]
          for before, after in replacements:
            count = source.count(before)
            if count != 1:
              raise SystemExit(f'expected exactly one generator edge, found {count}: {before[:100]}')
            source = source.replace(before, after)
          path.write_text(source)
          PY
          node .rsh016/generate.mjs
      - name: Commit generated candidate
        run: |
          rm -rf .rsh016
          rm -f .github/workflows/rsh-016-generate.yml
          rm -f scripts/rsh-016-analyze.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "RSH-016: generate isolated world builders [rsh-016-generated]"
          git push origin HEAD:agent/rsh-016-track-builders
      - name: Validate generated boundary
        run: |
          node scripts/check-world-builders.mjs
          npm run typecheck
          npm test
