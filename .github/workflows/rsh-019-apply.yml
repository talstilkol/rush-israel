name: rsh-019-apply

# deterministic rerun 10
on:
  push:
    branches:
      - agent/rsh-019-resource-ownership
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-019-apply
  cancel-in-progress: false

jobs:
  apply:
    name: rsh-019 / apply-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Check out exact RSH-019 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rsh-019-resource-ownership
          fetch-depth: 0

      - name: Decode and verify deterministic transformation
        run: |
          cat .rsh019-payload.part-* > /tmp/rsh019-payload.gz.b64
          echo "fb109b1e02dd2d1eedced90bc62e151a0fc1a8cfee351ada735df5d95e1440c3  /tmp/rsh019-payload.gz.b64" | sha256sum --check
          base64 -d /tmp/rsh019-payload.gz.b64 | gzip -d > /tmp/rsh019-apply.mjs
          echo "20bdfde09cea72cfe771d53e66fe00cc0240305e298e3f3992d2f2ad6e089e17  /tmp/rsh019-apply.mjs" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/rsh019-apply.mjs')
          source = path.read_text()
          before = 'if (source.includes(`RSH-019-OVERLAY-BEGIN:${id}`)) {'
          after = 'if (source.includes(`RSH-019-OVERLAY-BEGIN:${id}\\n`)) {'
          if source.count(before) != 1:
              raise SystemExit('unexpected overlay guard count')
          path.write_text(source.replace(before, after))
          PY
          echo "881fcae97fe4a87ae31f4d751fafe34a8fd76391d3e2b2082485f35a7456c51c  /tmp/rsh019-apply.mjs" | sha256sum --check
          node --check /tmp/rsh019-apply.mjs

      - name: Apply RSH-019 and reconcile historical validators
        run: |
          node /tmp/rsh019-apply.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, source):
              Path(path).write_text(source)

          def replace_once_text(source, before, after, label):
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return source.replace(before, after)

          path = "scripts/check-game-app-decomposition.test.mjs"
          source = read(path)
          before = '''test("temporary RSH-018 files and RSH-019 precreation fail closed", () => {
            const temp = baseline();
            temp.repositoryFiles.push(".github/workflows/rsh-018-finalizer.yml");
            assert.match(messages(validateGameAppDecomposition(temp)), /temporary RSH-018 files/);
            const later = baseline();
            later.repositoryFiles.push("RSH-019-RESOURCE-OWNERSHIP-CONTRACT.md");
            assert.match(messages(validateGameAppDecomposition(later)), /unauthorized RSH-019 structure/);
          });
          '''
          after = '''test("temporary RSH-018 files and RSH-020 precreation fail closed", () => {
            const temp = baseline();
            temp.repositoryFiles.push(".github/workflows/rsh-018-finalizer.yml");
            assert.match(messages(validateGameAppDecomposition(temp)), /temporary RSH-018 files/);
            const later = baseline();
            later.repositoryFiles.push("RSH-020-PREFLIGHT.json");
            assert.match(messages(validateGameAppDecomposition(later)), /unauthorized later-unit structure/);
          });
          '''
          source = replace_once_text(source, before, after, "game-app deferred-boundary test")
          write(path, source)

          path = "scripts/check-world-builders.mjs"
          source = read(path)
          source = replace_once_text(
              source,
              'import { gitBlobSha1, reconstructRsh015WorldSource, sha256 } from "./load-world-builders.mjs";\n',
              'import { gitBlobSha1, reconstructRsh015WorldSource, sha256 } from "./load-world-builders.mjs";\nimport { stripRsh019Overlay } from "./rsh019-overlay.mjs";\n',
              "world-builders overlay import",
          )
          source = replace_once_text(
              source,
              '  if (sha256(input.worldSource) !== EXPECTED_WORLD_SHA256) errors.push("world.ts differs from the accepted RSH-016 facade");\n',
              '  const normalizedWorldSource = stripRsh019Overlay("src/game/world.ts", input.worldSource);\n  if (sha256(normalizedWorldSource) !== EXPECTED_WORLD_SHA256) errors.push("world.ts differs from the accepted RSH-016 facade");\n',
              "world-builders normalized facade",
          )
          source = replace_once_text(
              source,
              '    const reconstructed = reconstructRsh015WorldSource(input.worldSource);\n',
              '    const reconstructed = reconstructRsh015WorldSource(normalizedWorldSource);\n',
              "world-builders normalized reconstruction",
          )
          source = replace_once_text(
              source,
              r'''  return { errors, moduleCount: manifest.extraction.modules.length, worldLines: (input.worldSource.match(/\n/g) ?? []).length, worldBytes: Buffer.byteLength(input.worldSource) };
          ''',
              r'''  return { errors, moduleCount: manifest.extraction.modules.length, worldLines: (normalizedWorldSource.match(/\n/g) ?? []).length, worldBytes: Buffer.byteLength(normalizedWorldSource) };
          ''',
              "world-builders normalized dimensions",
          )
          old_registry_hash = "64781dfb6d7cc53c0052374a1d2f647b0436e2017382902110f40a09262dc873"
          registry_hash = hashlib.sha256(Path("src/rendering/ResourceRegistry.ts").read_bytes()).hexdigest()
          source = replace_once_text(source, old_registry_hash, registry_hash, "world-builders registry authority")
          write(path, source)

          path = "scripts/check-world-core.mjs"
          source = read(path)
          source = replace_once_text(
              source,
              'import { fromRoot } from "./project-root.mjs";\n',
              'import { fromRoot } from "./project-root.mjs";\nimport { stripRsh019Overlay } from "./rsh019-overlay.mjs";\n',
              "world-core overlay import",
          )
          source = replace_once_text(
              source,
              '    worldLines: lineCount(input.worldSource),\n    worldBytes: Buffer.byteLength(input.worldSource),\n',
              '    worldLines: lineCount(stripRsh019Overlay("src/game/world.ts", input.worldSource)),\n    worldBytes: Buffer.byteLength(stripRsh019Overlay("src/game/world.ts", input.worldSource)),\n',
              "world-core normalized dimensions",
          )
          write(path, source)

          path = "scripts/check-world-core.test.mjs"
          source = read(path)
          source = replace_once_text(
              source,
              '"for (const d of bag) d.dispose();"',
              '"for (let index = bag.length - 1; index >= 0; index -= 1)"',
              "world-core old disposal loop",
          )
          source = replace_once_text(
              source,
              '"for (const d of [...bag].reverse()) d.dispose();"',
              '"for (let index = 0; index < bag.length; index += 1)"',
              "world-core altered disposal loop",
          )
          write(path, source)

          manifest_path = Path("WORLD-CORE-MANIFEST.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["preservation_identities"]["engine"] = {
              "path": "src/game/engine.ts",
              "lines": 2815,
              "bytes": 99577,
              "sha256": "3f4d54bbe0b68f9654ae8a92a2f56ce378a59a9790e8fbbe2ee05199ced192c1",
              "git_blob_sha1": "692663c6d05ab59c1d99c7a357999839b9ebb0ec",
          }
          manifest_source = json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          manifest_path.write_text(manifest_source)
          manifest_hash = hashlib.sha256(manifest_source.encode()).hexdigest()

          path = "scripts/check-world-core.mjs"
          source = read(path)
          source, count = re.subn(
              r'export const EXPECTED_MANIFEST_SHA256 = "[a-f0-9]+";',
              f'export const EXPECTED_MANIFEST_SHA256 = "{manifest_hash}";',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"world-core manifest hash: expected 1 match, found {count}")
          write(path, source)

          print(json.dumps({
              "historical_engine_sha256": manifest["preservation_identities"]["engine"]["sha256"],
              "world_core_manifest_sha256": manifest_hash,
              "resource_registry_sha256": registry_hash,
              "deferred_boundary": "RSH-020",
          }, indent=2))
          PY
          sed -i 's/[[:space:]]\+$//' NEXT-CONTRACT.md
          git rm .rsh019-payload.gz.b64 .rsh019-payload.part-* .github/workflows/rsh-019-apply.yml
          git diff --check

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate repository governance contract
        run: node scripts/check-governance-contract.mjs

      - name: Typecheck complete source
        run: npm run typecheck

      - name: Lint complete source
        run: npm run lint

      - name: Run complete unit-test suite
        run: |
          set +e
          npm test > /tmp/unit-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -B 4 -A 80 '^not ok ' /tmp/unit-tests.log || tail -n 200 /tmp/unit-tests.log
            echo '--- unit-test summary ---'
            tail -n 30 /tmp/unit-tests.log
            exit "$status"
          fi
          tail -n 20 /tmp/unit-tests.log

      - name: Run complete self-starting QA gate
        run: npm run qa:ci

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Commit exact RSH-019 candidate
        run: |
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git add -A
          git commit -m "Implement RSH-019 resource ownership and leak accounting"
          git push origin HEAD:agent/rsh-019-resource-ownership
