name: RSH-021 final storage-status repair

on:
  push:
    branches:
      - agent/rsh-021-save-schema-migrations

permissions:
  contents: write

concurrency:
  group: rsh-021-final-storage-status-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact RSH-021 branch
        uses: actions/checkout@v4
        with:
          ref: agent/rsh-021-save-schema-migrations
          fetch-depth: 0

      - name: Verify canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "7cff508a4cfa95c03ac34c5503912e70bed47b90"

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Apply final storage-status repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          save_path = Path("src/game/save.ts")
          source = save_path.read_text()

          old_browser = '''function browserStorage(): SaveStorage | null {
            try {
              return typeof localStorage === "undefined" ? null : localStorage;
            } catch {
              return null;
            }
          }'''
          new_browser = '''function browserStorage(): SaveStorage | null {
            return typeof localStorage === "undefined" ? null : localStorage;
          }'''
          if source.count(old_browser) != 1:
              raise SystemExit("browser storage accessor boundary not found exactly once")
          source = source.replace(old_browser, new_browser)

          old_load = '''function load(): SaveData {
            const storage = browserStorage();
            if (!storage) {
              lastSaveStatus = createSaveStatus("empty", "none", null);
              return emptySave();
            }
            const result = loadSaveFromStorage(storage);
            lastSaveStatus = result.status;
            return result.data;
          }'''
          new_load = '''function load(): SaveData {
            let storage: SaveStorage | null;
            try {
              storage = browserStorage();
            } catch (error) {
              lastSaveStatus = createSaveStatus("rejected", "none", null, [], [], false, false, {
                errorCode: "read-failed",
                error: String(error instanceof Error ? error.message : error),
              });
              return emptySave();
            }
            if (!storage) {
              lastSaveStatus = createSaveStatus("empty", "none", null);
              return emptySave();
            }
            const result = loadSaveFromStorage(storage);
            lastSaveStatus = result.status;
            return result.data;
          }'''
          if source.count(old_load) != 1:
              raise SystemExit("load boundary not found exactly once")
          source = source.replace(old_load, new_load)

          old_write = '''function write(data: SaveData) {
            // A rejected read owns the source bytes until RSH-022 provides an explicit
            // recovery decision. Automatic flushes and setters must not destroy them.
            if (lastSaveStatus.state === "rejected") return false;
            const storage = browserStorage();
            if (!storage) return false;'''
          new_write = '''function write(data: SaveData) {
            // A rejected read owns the source bytes until RSH-022 provides an explicit
            // recovery decision. Automatic flushes and setters must not destroy them.
            if (lastSaveStatus.state === "rejected") return false;
            let storage: SaveStorage | null;
            try {
              storage = browserStorage();
            } catch (error) {
              lastSaveStatus = createSaveStatus("write-failed", "current", SAVE_SCHEMA_VERSION, [], [], false, false, {
                errorCode: "write-failed",
                error: String(error instanceof Error ? error.message : error),
              });
              return false;
            }
            if (!storage) return false;'''
          if source.count(old_write) != 1:
              raise SystemExit("write boundary not found exactly once")
          save_path.write_text(source.replace(old_write, new_write))

          test_path = Path("scripts/check-save-schema.test.mjs")
          test_source = test_path.read_text()
          marker = 'test("the save facade catches storage acquisition and preserves rejected source bytes", () => {'
          start = test_source.find(marker)
          if start < 0:
              raise SystemExit("existing save facade regression test not found")
          replacement = '''test("the save facade rejects storage acquisition failures and preserves rejected source bytes", () => {
            const source = readFileSync(fromRoot("src", "game", "save.ts"), "utf8");
            assert.ok(source.includes(`function browserStorage(): SaveStorage | null {
            return typeof localStorage === "undefined" ? null : localStorage;
          }`));
            assert.ok(source.includes(`function load(): SaveData {
            let storage: SaveStorage | null;
            try {
              storage = browserStorage();
            } catch (error) {
              lastSaveStatus = createSaveStatus("rejected", "none", null, [], [], false, false, {
                errorCode: "read-failed",
                error: String(error instanceof Error ? error.message : error),
              });
              return emptySave();
            }`));
            assert.ok(source.includes(`function write(data: SaveData) {
            // A rejected read owns the source bytes until RSH-022 provides an explicit
            // recovery decision. Automatic flushes and setters must not destroy them.
            if (lastSaveStatus.state === "rejected") return false;
            let storage: SaveStorage | null;`));
            const manifest = JSON.parse(readFileSync(fromRoot("SAVE-SCHEMA-MANIFEST.json"), "utf8"));
            assert.equal(manifest.failure_policy.read_failure, "reject_without_overwrite_with_structured_status");
          });
          '''
          test_path.write_text(test_source[:start].rstrip() + "\n\n" + replacement)

          validator_path = Path("scripts/check-save-schema.mjs")
          validator = validator_path.read_text()
          anchor = '  if (manifest.unit !== "RSH-021" || manifest.current_schema.version !== 3 || manifest.migration_graph.length !== 3) errors.push("save-schema identity/count changed");\n'
          addition = anchor + '  if (manifest.failure_policy.read_failure !== "reject_without_overwrite_with_structured_status") errors.push("storage read failure policy changed");\n'
          if validator.count(anchor) != 1:
              raise SystemExit("validator manifest anchor not found exactly once")
          validator = validator.replace(anchor, addition)
          token_anchor = '  if (!input.saveFacadeSource.includes("export function getSaveStatus")) errors.push("save facade lost getSaveStatus");\n'
          token_addition = token_anchor + '''  for (const token of [
            'lastSaveStatus = createSaveStatus("rejected", "none", null',
            'errorCode: "read-failed"',
            'if (lastSaveStatus.state === "rejected") return false;',
          ]) if (!input.saveFacadeSource.includes(token)) errors.push("save facade lost storage-failure contract token: " + token);
          '''
          if validator.count(token_anchor) != 1:
              raise SystemExit("validator facade anchor not found exactly once")
          validator_path.write_text(validator.replace(token_anchor, token_addition))

          manifest_path = Path("SAVE-SCHEMA-MANIFEST.json")
          manifest = manifest_path.read_text()
          old_policy = '"read_failure": "structured_status"'
          new_policy = '"read_failure": "reject_without_overwrite_with_structured_status"'
          if manifest.count(old_policy) != 1:
              raise SystemExit("manifest read-failure policy not found exactly once")
          manifest_path.write_text(manifest.replace(old_policy, new_policy))

          old_facade = "8c32ea6530768f1113409986e0e04dadc456958437b17d3eda805ae1119c9362"
          old_test = "b56c9fee385b07c871d453e564a109b59a75001ec2f6d17b17d89d0aeda7b17d"
          old_manifest = "31d249c81bdf260d4a9df1e74a89ee488f21172604a036e72f51f3ff22e73df2"
          new_facade = sha256(save_path.read_bytes()).hexdigest()
          new_test = sha256(test_path.read_bytes()).hexdigest()

          def replace_tracked(old: str, new: str) -> None:
              result = subprocess.run(["git", "grep", "-l", "--", old], text=True, capture_output=True)
              if result.returncode not in (0, 1):
                  raise SystemExit(result.stderr)
              paths = [Path(line) for line in result.stdout.splitlines() if line]
              if not paths:
                  raise SystemExit(f"accepted identity not found: {old}")
              for path in paths:
                  path.write_text(path.read_text().replace(old, new))

          replace_tracked(old_facade, new_facade)
          replace_tracked(old_test, new_test)
          new_manifest = sha256(manifest_path.read_bytes()).hexdigest()
          replace_tracked(old_manifest, new_manifest)

          Path(".github/workflows/rsh-021-p2-repair.yml").unlink()
          print({
              "save_facade_sha256": new_facade,
              "test_source_sha256": new_test,
              "manifest_sha256": new_manifest,
          })
          PY
          git add -A
          git diff --cached --check
          ! git grep -n "8c32ea6530768f1113409986e0e04dadc456958437b17d3eda805ae1119c9362"
          ! git grep -n "b56c9fee385b07c871d453e564a109b59a75001ec2f6d17b17d89d0aeda7b17d"
          ! git grep -n "31d249c81bdf260d4a9df1e74a89ee488f21172604a036e72f51f3ff22e73df2"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run save-schema regression and authority tests
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --test scripts/check-save-schema.test.mjs

      - name: Validate save-schema authority
        run: node scripts/check-save-schema.mjs

      - name: Run complete unit-test suite
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Verify exact final-tree boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test ! -e .github/workflows/rsh-021-p2-repair.yml
          test ! -e .rsh021-payload
          test ! -e .github/workflows/rsh-021-apply.yml
          test ! -e scripts/rsh021-apply.mjs
          test ! -e RSH-022-PREFLIGHT.json
          test ! -e src/game/save-recovery
          test "$(git rev-parse origin/main)" = "7cff508a4cfa95c03ac34c5503912e70bed47b90"
          node scripts/check-save-schema.mjs

      - name: Commit and push corrected RSH-021 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "talsitelkol"
          git config user.email "tal_stilkol@hotmail.com"
          git commit -m "RSH-021: reject storage acquisition failures"
          git push origin HEAD:agent/rsh-021-save-schema-migrations
