name: rsh036-r69-font-layout
on:
  push:
    branches: [agent/rsh-036-r69-validation-20260906]
permissions:
  contents: write
jobs:
  validate-font-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact font layout hotfix and remove all transport files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,os,subprocess,json
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          patch=lzma.decompress(b''.join(Path(f'.r69-layout{i}').read_bytes() for i in (1,2)))
          assert hashlib.sha256(patch).hexdigest()=='807c5d9046e6c20fd6ce4f98e731310bf9381656c7c99d538798c9594cfcc729'
          p=Path(os.environ['RUNNER_TEMP'])/'layout.patch';p.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','e34e72d4eb26f1bc8d34450760af975d065fef1f'],check=True)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='41946e084b0a6512f7bf4d83ce7032cc37be9e65',tree
          Path('artifacts/font-layout').mkdir(parents=True,exist_ok=True)
          Path('artifacts/font-layout/source.json').write_text(json.dumps({'base':'e34e72d4eb26f1bc8d34450760af975d065fef1f','tree':tree,'changed_files':12,'scope':'focused font-layout validation, not full QA','accepted':False}))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify locked dependency inventory and exact tree
        run: |
          node scripts/dependency-closure.mjs --write
          git add -A
          test "$(git write-tree)" = 41946e084b0a6512f7bf4d83ce7032cc37be9e65
          node scripts/dependency-closure.mjs
      - name: Governance and complete unit suite
        run: |
          set -o pipefail
          node scripts/check-governance-contract.mjs
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint without suppression
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Three real-app font scenarios after settled probe layout
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node --input-type=module -e '
          import {chromium} from "playwright";
          import {writeFile} from "node:fs/promises";
          import {verifyFontDependencies} from "./scripts/font-dependency-browser.mjs";
          const browser=await chromium.launch({headless:true});
          let report={status:"failed",fontFilesWritten:0};
          try {const cases=await verifyFontDependencies(browser,"http://127.0.0.1:8080/?qa=1");report={status:"passed",fontFilesWritten:0,cases};console.log(JSON.stringify(report));}
          catch(error){report.error=String(error);throw error;}
          finally{await browser.close();await writeFile("artifacts/font-layout/results.json",JSON.stringify(report,null,2));}
          ' 2>&1 | tee artifacts/font-layout/run.log
      - name: Store only exact unreferenced tree objects, never commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='talstilkol/rush-israel'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip();assert tree=='41946e084b0a6512f7bf4d83ce7032cc37be9e65'
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines();assert len(paths)==12,paths
          assert all(not p.startswith('.github/workflows/') and not p.startswith('.r69-') for p in paths)
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/trees',data=json.dumps({'base_tree':'df16ef641daa3a4e614396c86ef87a7e501ada6c','tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=90) as response: result=json.load(response)
          assert result['sha']==tree,result['sha']
          Path('artifacts/font-layout/stored-tree.json').write_text(json.dumps({'tree':tree,'ref_mutations':0,'merges':0,'full_qa':False,'run_id':os.environ['GITHUB_RUN_ID']}))
          print('Stored validated tree objects only:',tree)
          PY
      - name: Original golden comparison, unchanged images and thresholds
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Preserve actual results including failed original comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r69-font-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
