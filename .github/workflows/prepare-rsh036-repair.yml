name: prepare-rsh036-repair
on:
  push:
    branches: [agent/rsh-036-ayalon-freeze]
    paths:
      - .github/workflows/prepare-rsh036-repair.yml
      - .github/maintenance/rsh036-source-*.b64
permissions:
  contents: read
concurrency:
  group: prepare-rsh036-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'talstilkol/rush-israel' && github.ref == 'refs/heads/agent/rsh-036-ayalon-freeze'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: 'true'
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the independently tested repair from the exact base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root=Path.cwd(); temp=Path(os.environ['RUNNER_TEMP'])/'repair-sources'; temp.mkdir()
          base='4878a3bcb48969dd3f8735a4f5b45b12aaa809e1'
          if subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()!=base: raise RuntimeError('Unexpected preparation parent')
          parts=[root/f'.github/maintenance/rsh036-source-{i}.b64' for i in (1,2,3)]
          maintenance=[str(p.relative_to(root)) for p in parts]+['.github/workflows/prepare-rsh036-repair.yml']
          actual=subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          if set(actual)!=set(maintenance): raise RuntimeError('Unexpected preparation changed set')
          compressed=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          if hashlib.sha256(compressed).hexdigest()!='7626e846cb82b6b09be347adfef74f1b1144d3242a7cc022f8c8effb56e5615b': raise RuntimeError('Repair source transport mismatch')
          sources=json.loads(gzip.decompress(compressed))
          expected={'repair_rsh036.py','control_rsh036.py','build_plan.py','program-execution.mjs','program-execution.test.mjs'}
          if set(sources)!=expected: raise RuntimeError('Unexpected generator source set')
          for name,text in sources.items(): (temp/name).write_text(text)
          subprocess.run(['python',str(temp/'repair_rsh036.py'),'--root',str(root)],check=True)
          for name in ['program-execution.mjs','program-execution.test.mjs']: shutil.copy2(temp/name,root/'scripts'/name)
          subprocess.run(['python',str(temp/'build_plan.py')],check=True)
          for name in maintenance: (root/name).unlink()
          subprocess.run(['git','add','--all'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          if tree!='c74b50f2795c8a87e71fa650aac99969dc2a0672': raise RuntimeError('Candidate differs from locally verified complete tree: '+tree)
          report=Path(os.environ['RUNNER_TEMP'])/'repair-evidence'; report.mkdir()
          (report/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          (report/'changed-files.txt').write_bytes(subprocess.check_output(['git','diff','--cached','--name-status']))
          (report/'candidate-tree.txt').write_text(tree+'\n')
          (report/'generator-sources.json').write_text(json.dumps(sources,indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: node scripts/check-governance-contract.mjs
      - name: Lint candidate without suppressing failures
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/repair-evidence/lint.log"
      - name: Run every unit and new regression test
        run: npm test 2>&1 | tee "$RUNNER_TEMP/repair-evidence/tests.tap"
      - name: Store validated tree objects only; never move a ref or merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          api='https://api.github.com/repos/talstilkol/rush-israel'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(path,body=None):
              req=urllib.request.Request(api+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req,timeout=120) as result: return json.load(result)
          head=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          if request('/git/ref/heads/agent/rsh-036-ayalon-freeze')['object']['sha']!=head: raise RuntimeError('Live candidate branch advanced')
          if request('/git/ref/heads/main')['object']['sha']!='e01d91de5dfa11685a51dcea90c1dbc8e2d2148a': raise RuntimeError('Live main advanced')
          subprocess.run(['git','diff','--exit-code'],check=True)
          entries=[]
          for line in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames']).decode().splitlines():
              status,path=line.split('\t')
              if status=='D': entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              elif status in ('M','A'):
                  mode=subprocess.check_output(['git','ls-files','--stage','--',path]).decode().split()[0]
                  entries.append({'path':path,'mode':mode,'type':'blob','content':Path(path).read_text()})
              else: raise RuntimeError('Unsupported candidate change: '+line)
          expected=subprocess.check_output(['git','write-tree']).decode().strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          result=request('/git/trees',{'base_tree':base_tree,'tree':entries})
          if result['sha']!=expected: raise RuntimeError('Remote tree identity mismatch')
          evidence={'preparation_head':head,'candidate_tree':expected,'changed_entries':len(entries),'unit':'RSH-036','accepted':False,'ref_mutations':0,'merge_operations':0,'normal_required_ci_still_required':True}
          (Path(os.environ['RUNNER_TEMP'])/'repair-evidence/candidate.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PY
      - name: Retain all successful or failed preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsh036-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-evidence/**
          if-no-files-found: error
          retention-days: 14
