name: rsh036-r63-prepare
on:
  push:
    branches: [agent/rsh-036-r63-validation-20260905]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
      UPDATE_GOLDEN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact candidate without preparation files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,os,subprocess
          patch=lzma.decompress(Path('.rsh036-r63.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='5b153197b3dec381f32a38cfbba1af31a31a4579cdf689742808f1813d7b39ba'
          target=Path(os.environ['RUNNER_TEMP'])/'candidate.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','1ef48b96e8385c6dd3351c9a6ec43d45c1bd7aa8'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='3a06144763611b539ff064dfe1bb390b15467e1f',tree
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/candidate.patch').write_bytes(patch)
          Path('artifacts/candidate-tree.txt').write_text(tree+'\n')
          print('Verified candidate tree',tree)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Governance and complete unit suite
        run: |
          set -o pipefail
          node scripts/check-governance-contract.mjs 2>&1 | tee artifacts/governance.log
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Full QA and locked typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: Actual browser resource rollback and runtime recovery
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated source tree objects only, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='3a06144763611b539ff064dfe1bb390b15467e1f'
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==21
          assert all(not p.startswith('.github/workflows/') and not p.startswith('.rsh036-') for p in paths)
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          data=json.dumps({'base_tree':'e3d9d18b958756443ec83f3dfb5bc838ea684084','tree':entries}).encode()
          request=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==tree,result['sha']
          metadata={'tree':tree,'base':'1ef48b96e8385c6dd3351c9a6ec43d45c1bd7aa8','changed_files':21,'run_id':os.environ['GITHUB_RUN_ID'],'ref_mutations':0,'merges':0,'accepted':False,'golden_validation':'separate_following_step'}
          Path('artifacts/validated-tree.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Unchanged-threshold golden diagnostic, no baseline updates
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Preserve all actual results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsh036-r63-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            screenshots/**
          if-no-files-found: error
          retention-days: 14
