name: rsh036-r62-publish-validated-tree
on:
  push:
    branches: [agent/rsh-036-r62-validation-20260905]
permissions:
  contents: write
jobs:
  publish-validated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact already-tested tree without temporary transport files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,os,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          patch=lzma.decompress(b''.join(Path(f'.rsh036-r62-part{i:02d}').read_bytes() for i in range(1,7)))
          assert hashlib.sha256(patch).hexdigest()=='100b8c114c09f35149b62f670923ab303e2e154d34d8a0f3f33abb326dd334a7'
          target=Path(os.environ['RUNNER_TEMP'])/'candidate.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','ba89268646bf8890f8074642049b23369eda582d'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='e3d9d18b958756443ec83f3dfb5bc838ea684084',tree
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==41,len(paths)
          assert all(not p.startswith('.rsh036-') and p!='.github/workflows/rsh036-r62-prepare.yml' for p in paths)
          print('Exact tree passed 567 tests, four browser failure cases, QA, lint and build in run 33982810194:',tree)
          print('This job publishes only a new isolated candidate branch; PR and main are untouched.')
          PY
      - name: Publish isolated candidate using standard authenticated Git transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,os,subprocess
          base='ba89268646bf8890f8074642049b23369eda582d'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='e3d9d18b958756443ec83f3dfb5bc838ea684084'
          branch='refs/heads/agent/rsh-036-r62-verified-20260905'
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env=os.environ.copy();env.update({'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth,'GIT_TERMINAL_PROMPT':'0'})
          remote=subprocess.check_output(['git','ls-remote','origin',branch],env=env,text=True).strip()
          if remote:
            existing=remote.split()[0]
            subprocess.run(['git','fetch','origin',branch],env=env,check=True)
            assert subprocess.check_output(['git','show','-s','--format=%T',existing],text=True).strip()==tree,'Existing candidate has different tree; refusing overwrite'
            commit=existing
          else:
            commit=subprocess.check_output(['git','-c','user.name=RUSH validation bot','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit-tree',tree,'-p',base],input='fix(RSH-036): runtime recovery, visible route map and exact-source CI; master plan r6.2\n',text=True).strip()
            subprocess.run(['git','push','origin',commit+':'+branch],env=env,check=True)
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          metadata={'base_commit':base,'commit':commit,'tree':tree,'changed_files':41,'published_branch':branch,'main_mutations':0,'pr_branch_mutations':0,'merges':0,'unit_accepted':False,'validation_run_id':33982810194,'publication_run_id':os.environ['GITHUB_RUN_ID']}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/validated-tree.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Preserve publication metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsh036-r62-publication-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
