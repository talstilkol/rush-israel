name: rsh014-control-remediate

on:
  push:
    branches:
      - agent/rsh-014-track-modules

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[rsh014-control-remediated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          npm ci

      - name: Close stale RSH-014 execution authorities
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "QUEUE.json",
              '    "RSH-001–RSH-013": "accepted",\n    "RSH-014": "eligible_under_owner_next_2",\n',
              '    "RSH-001–RSH-014": "accepted",\n',
          )
          replace_once(
              "QUEUE.json",
              '    "current_action": "After PR #16 merges, continue the current next 2 instruction by starting RSH-014 only from verified live main.",',
              '    "current_action": "No unit is authorized; RSH-015 remains deferred until a new explicit owner instruction.",',
          )
          replace_once(
              "QUEUE.json",
              '    "RSH-014_precreated": false,',
              '    "RSH-014_completed": true,',
          )
          replace_once(
              "QUEUE.json",
              '    "current_instruction": "next 2",',
              '    "completed_instruction": "next 2",',
          )
          replace_once(
              "QUEUE.json",
              '      "continuation_instruction": "next 2",',
              '      "completion_instruction": "next 2",',
          )
          replace_once(
              "CURRENT-STATE.json",
              '    "continuation_instruction": "next 2"',
              '    "completion_instruction": "next 2",\n    "next_instruction_required": true',
          )

          test_path = Path("scripts/program-control.test.mjs")
          text = test_path.read_text()
          marker = '''  assert.equal(queue.next_instruction_contract.batch_closed, true);
          });
          '''
          replacement = '''  assert.equal(queue.next_instruction_contract.batch_closed, true);
            assert.equal(queue.state_rules["RSH-001–RSH-014"], "accepted");
            assert.equal(queue.state_rules["RSH-014"], undefined);
            assert.deepEqual(queue.state_rules.eligible, []);
            assert.equal(
              queue.next_instruction_contract.current_action,
              "No unit is authorized; RSH-015 remains deferred until a new explicit owner instruction.",
            );
            assert.equal(queue.next_instruction_contract["RSH-014_completed"], true);
            assert.equal(queue.next_instruction_contract["RSH-014_precreated"], undefined);
            assert.equal(queue.next_instruction_contract.current_instruction, undefined);
            assert.equal(queue.next_instruction_contract.completed_instruction, "next 2");
            assert.equal(queue.policy.active_bounded_batch.continuation_instruction, undefined);
            assert.equal(queue.policy.active_bounded_batch.completion_instruction, "next 2");
            assert.equal(current.batch_authorization.continuation_instruction, undefined);
            assert.equal(current.batch_authorization.completion_instruction, "next 2");
            assert.equal(current.batch_authorization.next_instruction_required, true);
          });
          '''
          if replacement in text:
              raise SystemExit("closed-batch regression assertions already exist")
          if text.count(marker) != 1:
              raise SystemExit(f"program-control marker expected once, found {text.count(marker)}")
          test_path.write_text(text.replace(marker, replacement, 1))
          PY

          node -e 'JSON.parse(require("node:fs").readFileSync("QUEUE.json", "utf8")); JSON.parse(require("node:fs").readFileSync("CURRENT-STATE.json", "utf8"));'
          git diff --check

      - name: Run program-control regression
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/program-control.test.mjs

      - name: Commit exact remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rsh014-control-remediate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RSH-014: close stale queue authorities [rsh014-control-remediated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
