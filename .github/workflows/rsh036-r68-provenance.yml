name: rsh036-r68-controlled-attribution
on:
  push:
    branches: [agent/rsh-036-r68-provenance-20260906]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact original product sources into diagnostic-only directory
        run: |
          mkdir -p artifacts/history artifacts/attribution
          git archive b0e3e525689955e6ff944b49f08c814e49cf03fa -- src public ':(exclude)**/*.woff' ':(exclude)**/*.woff2' ':(exclude)**/*.ttf' ':(exclude)**/*.otf' ':(exclude)**/*.eot' | tar -x -C artifacts/history
          git rev-parse HEAD > artifacts/attribution/diagnostic-head.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Controlled direct-engine replay with exact historical asset routing
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node .r68-compare.mjs 2>&1 | tee artifacts/attribution/run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rsh036-r68-attribution-${{ github.run_id }}
          path: artifacts/attribution/**
          retention-days: 14
          if-no-files-found: error
