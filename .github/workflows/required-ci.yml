name: required-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: required-ci / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Capture exact-head audit sources and complete tree inventory
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-head.txt"
          git ls-tree -r -l HEAD > "$RUNNER_TEMP/source-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/rush-audit-source.tar.gz" HEAD -- . ':(exclude)**/*.woff' ':(exclude)**/*.woff2' ':(exclude)**/*.ttf' ':(exclude)**/*.otf' ':(exclude)**/*.eot'
          sha256sum "$RUNNER_TEMP/rush-audit-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"

      - name: Upload audit sources before validation
        uses: actions/upload-artifact@v4
        with:
          name: audit-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rush-audit-source.tar.gz
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source-sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate repository governance contract
        run: node scripts/check-governance-contract.mjs

      - name: Lint all tracked source
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log

      - name: Run complete unit-test suite
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/unit-tests.tap

      - name: Run self-starting QA gate
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log

      - name: Verify browser runtime failure recovery and minimap
        run: |
          mkdir -p artifacts
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log

      - name: Build deterministic development bundle
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log

      - name: Write deterministic diagnostic summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/write-ci-summary.mjs

      - name: Upload required-CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            screenshots/**
            dist/**
            .output/**
            test-results/**
            playwright-report/**
            npm-debug.log*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
