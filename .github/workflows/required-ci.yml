name: required-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: required-ci / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Regenerate exact package-lock root metadata once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          if (lock.name !== "app-builder-workspace") throw new Error("top-level lock name drift");
          if (lock.version !== "0.0.0-private") throw new Error("top-level lock version missing");
          if (lock.packages?.[""]?.name !== "app-builder-workspace") throw new Error("root lock name drift");
          if (lock.packages?.[""]?.version !== "0.0.0-private") throw new Error("root lock version missing");
          if (lock.packages?.[""]?.license !== "UNLICENSED") throw new Error("root lock licence missing");
          NODE
          if git diff --quiet -- package-lock.json; then
            echo "package-lock metadata already synchronized"
          else
            test "$(git diff --name-only | tr '\n' ' ')" = "package-lock.json "
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "RSH-012: synchronize package-lock metadata"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate repository governance contract
        run: node scripts/check-governance-contract.mjs

      - name: Lint all tracked source
        run: npm run lint

      - name: Run complete unit-test suite
        run: npm test

      - name: Run self-starting QA gate
        run: npm run qa:ci

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Write deterministic diagnostic summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/write-ci-summary.mjs

      - name: Upload required-CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            screenshots/**
            dist/**
            .output/**
            test-results/**
            playwright-report/**
            npm-debug.log*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
