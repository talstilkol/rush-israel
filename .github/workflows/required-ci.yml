name: required-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-022-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: RSH-022 exact candidate transport
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rsh-022-save-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify and publish the exact RSH-022 candidate
        shell: bash
        run: |
          set -euo pipefail

          cat .rsh022-transport/patch.b64.* > /tmp/rsh022.patch.gz.b64
          echo "e102894e156ec81a8ffef35fb56663bc986d88e338cae697e9875379ce7a60b6  /tmp/rsh022.patch.gz.b64" | sha256sum --check --strict

          base64 --decode /tmp/rsh022.patch.gz.b64 > /tmp/rsh022.patch.gz
          echo "4654a1ef6dbc3186dc0194c06446876f7ec44dbda7815916194a479d6a205b36  /tmp/rsh022.patch.gz" | sha256sum --check --strict

          gzip --decompress --stdout /tmp/rsh022.patch.gz > /tmp/rsh022.patch
          echo "e47a5a984caec82f040127b260b7119022c4954a38ffa2323dd2ea3ca16ed4f7  /tmp/rsh022.patch" | sha256sum --check --strict

          git fetch origin main
          git checkout origin/main -- scripts/write-ci-summary.mjs .github/workflows/required-ci.yml
          git rm --recursive .rsh022-transport
          git apply --index /tmp/rsh022.patch

          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = "edef74d74f0ac05ac4a3a05f4c740e9a410306b7"
          test -z "$(git status --porcelain | grep -E 'RSH-023|rsh023|records-v2' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RSH-022: add verified save recovery and visible failure handling"
          git push origin HEAD:agent/rsh-022-save-recovery
