name: rsh036-r65-prepare
on:
  push:
    branches: [agent/rsh-036-r65-validation-20260906]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hash-pinned candidate without preparation files
        run: |
          python - <<'PY'
          import hashlib,lzma,os,subprocess
          from pathlib import Path
          patch=lzma.decompress(b''.join(Path(f'.rsh036-r65-part{i:02d}').read_bytes() for i in range(1,5)))
          assert hashlib.sha256(patch).hexdigest()=='644537f4df9b0820e3724e77f025c86b46e342e7781ed492f402087481b50793'
          target=Path(os.environ['RUNNER_TEMP'])/'candidate.patch';target.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','3486e3351f596670e9fb0a55387bf0ecdcd442df'],check=True)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='bae88478e01259e1683e6107c2ceffa25e467a9a',tree
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/candidate-tree.txt').write_text(tree+'\n')
          Path('artifacts/candidate.patch').write_bytes(patch)
          print('Exact candidate tree:',tree)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Governance and complete unit suite
        run: |
          set -o pipefail
          node scripts/check-governance-contract.mjs 2>&1 | tee artifacts/governance.log
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Full QA and locked typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: Actual browser asset rollback and scene recovery
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated source tree objects only, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='talstilkol/rush-israel'
          base='3486e3351f596670e9fb0a55387bf0ecdcd442df'
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='bae88478e01259e1683e6107c2ceffa25e467a9a'
          assert not subprocess.check_output(['git','diff','--name-only']).strip(),'Unstaged source mutation'
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z',base]).decode().split('\0')
          entries=[]
          for path in filter(None,paths):
            assert not path.startswith(('.rsh036-','.github/'))
            mode=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0]
            assert mode in ('100644','100755')
            entries.append({'path':path,'mode':mode,'type':'blob','content':Path(path).read_text(encoding='utf-8')})
          assert len(entries)==32,len(entries)
          data=json.dumps({'base_tree':'093a1c6c9152dcfc37d2cb751ff77d2d45087f03','tree':entries}).encode()
          request=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==tree,result['sha']
          metadata={'base_commit':base,'tree':tree,'changed_files':len(entries),'ref_mutations':0,'merges':0,'unit_accepted':False,'run_id':os.environ['GITHUB_RUN_ID'],'normal_validation_passed':True,'golden_validation':'not_yet_run'}
          Path('artifacts/validated-tree.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Read-only original golden source provenance
        run: |
          set -o pipefail
          node scripts/golden-provenance.mjs 2>&1 | tee artifacts/golden-provenance.log
      - name: Unchanged original golden comparisons, no rebaselining
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsh036-r65-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            screenshots/**
            golden-tmp/**
          if-no-files-found: error
          retention-days: 14
