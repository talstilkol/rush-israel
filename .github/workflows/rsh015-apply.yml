name: RSH-015 apply exact implementation patch

on:
  push:
    branches:
      - agent/rsh-015-world-core
    paths:
      - .github/workflows/rsh015-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Verify and apply exact RSH-015 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0e00610ac0426aa2d134c7f30b943b080702699b"
          expected=(
            016ad6f5a48760a847feb6b5b892a1d4d494734a
            650936f678920d91cef0c0e8c8358483d5b14e6c
            9908c531f68b3ac3f3fac2c8f5b92759520410af
            4a441dc5ed7b1ce060fd6313fe0e5d6ca025d6a1
            cc231825f702bc733c39380194a1c0d28f391766
            5533accefaa9a6cd2db17599e9b7a41f4adee0b8
            7aa32957a7f074a6ec409476643047a4d760de9a
            448e32c660b1806fbac8fedf6568f263b08e61cb
            f42844c43bca26d791a30ee6aa88165545f68cdc
          )
          for i in $(seq -w 0 8); do
            path=".rsh015-transfer/part-${i}"
            test "$(git hash-object "$path")" = "${expected[$((10#$i))]}"
          done
          cat .rsh015-transfer/part-* > /tmp/rsh015.patch.gz
          echo "982eb1b3f181efb45fb09287afd1affb85a7e074c94f64ac9d222177b376c86c  /tmp/rsh015.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/rsh015.patch.gz > /tmp/rsh015.patch
          echo "9aed2176ed950ead71561c51fdd37b49d4669a1a37bdac2efca9e46707bbe55a  /tmp/rsh015.patch" | sha256sum --check --strict
          git apply --check /tmp/rsh015.patch
          git apply --index /tmp/rsh015.patch
          rm -rf .rsh015-transfer .github/workflows/rsh015-apply.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached HEAD^ --name-only | wc -l)" -eq 20
          test "$(git diff --cached HEAD^ --binary --full-index | sha256sum | cut -d' ' -f1)" = "9aed2176ed950ead71561c51fdd37b49d4669a1a37bdac2efca9e46707bbe55a"
          test "$(git write-tree)" = "8dfb231a4e30623320b4d1f99f10f19853ff7eb9"
          ! git diff --cached HEAD^ --name-only | grep -Ei '(^|/)(rsh-016|world/(tracks|builders))'

      - name: Commit exact RSH-015 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RSH-015: extract the reusable world core"
          git push origin "HEAD:${{ github.ref_name }}"
