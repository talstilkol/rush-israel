name: rsh-017-finalizer-packaging-fix

on:
  push:
    branches:
      - agent/rsh-017-engine-adapters
    paths:
      - .github/workflows/rsh-017-finalizer-packaging-fix.yml

permissions:
  contents: write

concurrency:
  group: rsh-017-finalizer-packaging-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fix finalizer packaging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rsh-017-type-boundary-finalizer.yml')
          source = path.read_text()

          replacements = [
              (
                  "    paths:\n      - .github/workflows/rsh-017-type-boundary-finalizer.yml\n",
                  "",
                  "push path filter",
              ),
              (
                  "          git clean -fdX\n",
                  "",
                  "destructive ignored-file cleanup",
              ),
              (
                  "          test \"$actual\" = \"$expected\"\n          test -z \"$(git status --short | grep '^??' || true)\"\n",
                  "          test \"$actual\" = \"$expected\"\n          git diff --cached --check\n",
                  "staged-path verification",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} must match exactly once; matched {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          rm -f .github/workflows/rsh-017-finalizer-packaging-fix.yml

          git diff --check
          git diff -- .github/workflows/rsh-017-type-boundary-finalizer.yml

      - name: Commit packaging fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/rsh-017-finalizer-packaging-fix.yml \
            .github/workflows/rsh-017-type-boundary-finalizer.yml

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/rsh-017-finalizer-packaging-fix.yml \
            .github/workflows/rsh-017-type-boundary-finalizer.yml | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

          git commit -m "RSH-017: fix finalizer commit packaging"
          git push origin HEAD:refs/heads/agent/rsh-017-engine-adapters
