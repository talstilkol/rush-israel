name: rsh-017-preservation-finalizer

on:
  push:
    branches:
      - agent/rsh-017-engine-adapters
    paths:
      - .github/workflows/rsh-017-unit-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-017-preservation-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Apply bounded successor-preservation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s' '' > /tmp/rsh017-fix.patch.xz.b64

          test "$(wc -c < /tmp/rsh017-fix.patch.xz.b64)" -eq 4188
          echo "214579f3336512dea2b29c23afca85f9aea2e9df23cd1587c976f6fa7b40a710  /tmp/rsh017-fix.patch.xz.b64" | sha256sum -c -
          base64 --decode /tmp/rsh017-fix.patch.xz.b64 > /tmp/rsh017-fix.patch.xz
          test "$(wc -c < /tmp/rsh017-fix.patch.xz)" -eq 3140
          echo "c76052144afc877932c4c5e66a6967c9b79cf4fc69d7c8d9fc0fb13088eef062  /tmp/rsh017-fix.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/rsh017-fix.patch.xz > /tmp/rsh017-fix.patch
          test "$(wc -c < /tmp/rsh017-fix.patch)" -eq 12361
          echo "d9b49f328898e4d7a9d8de9318a5bfa435606fcfcf99f53dc465b74dc9991038  /tmp/rsh017-fix.patch" | sha256sum -c -

          git apply --check --whitespace=nowarn /tmp/rsh017-fix.patch
          git apply --whitespace=nowarn /tmp/rsh017-fix.patch
          rm -f .github/workflows/rsh-017-unit-diagnostic.yml

      - name: Validate bounded RSH-017 authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-engine-adapters.mjs
          node scripts/check-world-core.mjs
          node scripts/check-track-schema.mjs
          node --test \
            scripts/check-track-consumer-source-pin.test.mjs \
            scripts/check-world-core.test.mjs \
            scripts/check-engine-adapters.test.mjs
          npm test

      - name: Commit exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/rsh-017-unit-diagnostic.yml \
            scripts/check-track-consumer-source-pin.mjs \
            scripts/check-track-consumer-source-pin.test.mjs \
            scripts/check-world-core.mjs \
            scripts/check-world-core.test.mjs | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --short | grep '^??' || true)"

          git commit -m "RSH-017: reconcile engine adapter preservation gates"
          git push origin HEAD:refs/heads/agent/rsh-017-engine-adapters
