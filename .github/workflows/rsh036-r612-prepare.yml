name: rsh036-r612-prepare
on:
  push:
    branches: [agent/rsh-036-r612-validation-20260906]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover hash-verified candidate and isolate original product source
        run: |
          python - <<'PY'
          import json,lzma,hashlib,os,subprocess
          from pathlib import Path
          raw=lzma.decompress(b''.join(Path(f'.r612-transfer-{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(raw).hexdigest()=='9e79b416c978079e5cfecf4dcf40883d0bbd65cba4a0314baf4edf94645b7e70'
          payload=json.loads(raw)
          Path(os.environ['RUNNER_TEMP'],'r612.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',payload['base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==payload['base_tree']
          Path('scripts/ramp-contact-browser.mjs').write_text(payload['baseline_browser'])
          Path('scripts/ramp-contact.test.mjs').write_text(payload['baseline_unit'])
          Path('artifacts').mkdir(exist_ok=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Same23 actual-vehicle tests on old code must reproduce10 failures
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p=subprocess.run(['node','--test','scripts/ramp-contact.test.mjs'],capture_output=True,text=True)
          Path('artifacts/contact-old.tap').write_text(p.stdout+p.stderr)
          print(p.stdout,p.stderr)
          assert p.returncode==1
          for expected in ['# tests 23','# pass 13','# fail 10','# skipped 0']:
            assert expected in p.stdout, expected
          PY
      - name: Real old Ayalon route must reproduce unreachable overhead capture
        env:
          RAMP_CONTACT_OUTPUT: artifacts/contact-old
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/ramp-contact-browser.mjs --expect-overhead-capture 2>&1 | tee artifacts/contact-old.log
          git diff --exit-code -- src public
      - name: Apply reviewed patch and assert complete candidate tree
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          p=json.loads(Path(os.environ['RUNNER_TEMP'],'r612.json').read_text())
          Path('scripts/ramp-contact-browser.mjs').unlink()
          Path('scripts/ramp-contact.test.mjs').unlink()
          patch=p['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==p['patch_sha256']
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==p['tree']
          subprocess.run(['git','diff','--exit-code'],check=True)
          Path('artifacts/candidate-identity.json').write_text(json.dumps({'base':p['base'],'tree':p['tree'],'changed':p['changed']}))
          PY
      - name: Verify generated inventory with locked parser without accepting drift
        run: |
          cp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          node scripts/dependency-closure.mjs --write
          cmp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          git diff --exit-code
      - name: Governance and full unit suite
        run: |
          node scripts/check-governance-contract.mjs
          set -o pipefail
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint without suppression
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Same real Ayalon route and supported ramp probes after repair
        env:
          RAMP_CONTACT_OUTPUT: artifacts/contact-new
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/ramp-contact-browser.mjs 2>&1 | tee artifacts/contact-new.log
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('artifacts/contact-old/results.json').read_text())
          new=json.loads(Path('artifacts/contact-new/results.json').read_text())
          assert old['recipe']==new['recipe']
          assert old['rampCount']==new['rampCount']==50
          assert old['colliderCount']==new['colliderCount']==546
          assert old['checkpointCount']==new['checkpointCount']==8
          PY
      - name: Controlled readiness fixtures
        run: node scripts/golden-capture-browser.mjs
      - name: Full QA and locked typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: All retained runtime tests plus actual ramp contact
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Safe Ayalon capture and steering without reference changes
        run: |
          set -o pipefail
          npm run qa:ayalon 2>&1 | tee artifacts/ayalon-capture.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store only validated unreferenced tree objects, no commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          p=json.loads(Path(os.environ['RUNNER_TEMP'],'r612.json').read_text())
          subprocess.run(['git','diff','--exit-code'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==p['tree']
          entries=[]
          for name in p['changed']:
            assert not name.startswith(('.github/','.r612','/')) and '..' not in Path(name).parts
            entries.append({'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()})
          data=json.dumps({'base_tree':p['base_tree'],'tree':entries}).encode()
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response: result=json.load(response)
          assert result['sha']==p['tree']
          Path('artifacts/prepared-tree.json').write_text(json.dumps({'tree':result['sha'],'ref_writes':0,'commit_writes':0,'merges':0}))
          print('Validated unreferenced tree:',result['sha'])
          PY
      - name: Original golden comparison with unchanged references and thresholds
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Preserve actual evidence including any comparison failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r612-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            golden-tmp/**
          if-no-files-found: error
          retention-days: 14
