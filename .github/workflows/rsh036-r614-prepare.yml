name: rsh036-r614-prepare
on:
  push:
    branches: [agent/rsh-036-r614-validation-20260908]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover reviewed payload and isolate exact old source
        run: |
          python - <<'PY'
          import json,lzma,hashlib,os,subprocess
          from pathlib import Path
          raw=lzma.decompress(b''.join(Path(f'.r614-transfer-{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(raw).hexdigest()=='682238e3cb513ac603edea25fa0f4034d760bf64ea338e31a167328d6387fcbb'
          data=json.loads(raw)
          Path(os.environ['RUNNER_TEMP'],'r614.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',data['base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==data['base_tree']
          for name,content in data['old_checks'].items():
            assert not Path(name).exists()
            Path(name).write_text(content)
          Path('artifacts').mkdir(exist_ok=True)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Same22 real-car collision cases must reproduce19 failures on old code
        run: |
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          p=subprocess.run(['node','--test','scripts/collider-centre.test.mjs'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          Path('artifacts/collider-before.tap').write_bytes(p.stdout)
          assert p.returncode==1
          for key,value in [('tests',22),('pass',3),('fail',19),('skipped',0),('cancelled',0)]:
            assert re.search(r'^# '+key+' '+str(value)+r'$',p.stdout.decode(),re.M)
          PY
      - name: Actual old Ayalon circular catalogue must reproduce centre overlaps
        env:
          COLLIDER_CENTRE_OUTPUT: artifacts/collider-old
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/collider-centre-browser.mjs --expect-legacy-mismatch 2>&1 | tee artifacts/collider-old.log
          git diff --exit-code -- src public
      - name: Apply candidate and assert exact complete product tree
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          data=json.loads(Path(os.environ['RUNNER_TEMP'],'r614.json').read_text())
          for name in data['old_checks']: Path(name).unlink()
          patch=data['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==data['patch_sha256']
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==data['tree']
          subprocess.run(['git','diff','--exit-code'],check=True)
          Path('artifacts/candidate-identity.json').write_text(json.dumps({'base':data['base'],'tree':data['tree'],'changed':data['changed']}))
          PY
      - name: Locked inventory and governance without accepting drift
        run: |
          cp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          node scripts/dependency-closure.mjs --write
          cmp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          git diff --exit-code
          node scripts/check-governance-contract.mjs
      - name: Complete unit suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint without suppression
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Same actual Ayalon collision catalogue and unchanged clearance observations after repair
        env:
          COLLIDER_CENTRE_OUTPUT: artifacts/collider-new
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/collider-centre-browser.mjs 2>&1 | tee artifacts/collider-new.log
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/collider-old/results.json').read_text())
          b=json.loads(Path('artifacts/collider-new/results.json').read_text())
          assert a['circularIndices']==b['circularIndices']
          assert a['clearance']==b['clearance']
          assert a['colliderCount']==b['colliderCount']==546
          PY
      - name: Controlled capture readiness
        run: node scripts/golden-capture-browser.mjs
      - name: Full QA and locked typecheck with retained acceleration, drive and landing contracts
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: All retained actual runtime and resource regressions plus collision cases
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Safe Ayalon capture and steering without reference writes
        run: |
          set -o pipefail
          npm run qa:ayalon 2>&1 | tee artifacts/ayalon-capture.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated unreferenced tree only, never commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          data=json.loads(Path(os.environ['RUNNER_TEMP'],'r614.json').read_text())
          subprocess.run(['git','diff','--exit-code'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==data['tree']
          entries=[]
          for name in data['changed']:
            assert not name.startswith(('.github/','.r614','/')) and '..' not in Path(name).parts
            entries.append({'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()})
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=json.dumps({'base_tree':data['base_tree'],'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response: result=json.load(response)
          assert result['sha']==data['tree']
          Path('artifacts/prepared-tree.json').write_text(json.dumps({'tree':result['sha'],'ref_writes':0,'commit_writes':0,'merges':0}))
          PY
      - name: Original golden comparison with unchanged references and thresholds
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Preserve actual results including failed comparisons and clearance observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r614-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            golden-tmp/**
          if-no-files-found: error
          retention-days: 14
