name: rsh-017-finalize-engine-adapters

on:
  push:
    branches:
      - agent/rsh-017-engine-adapters
    paths:
      - .github/workflows/rsh-017-source-transfer.yml
      - .rsh017-patch.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-017-finalize-engine-adapters
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct, verify and apply the bounded RSH-017 overlay
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mapfile -t parts < <(printf '%s\n' .rsh017-patch.part-* | sort -V)
          test "${#parts[@]}" -eq 13

          cat "${parts[@]}" > /tmp/rsh017-patch.b64
          test "$(wc -c < /tmp/rsh017-patch.b64)" -eq 57304
          echo "2fa06f71d2534203733f788eb2b1ed04b5df8fd5dca66a3e5147a72bad3fdfe7  /tmp/rsh017-patch.b64" | sha256sum -c -

          base64 --decode /tmp/rsh017-patch.b64 > /tmp/rsh017.patch.xz
          test "$(wc -c < /tmp/rsh017.patch.xz)" -eq 42976
          echo "9ee4edd8f08f9c56ab778c523e07c8fda322c864b5d8a2906bb466fd0c088ae8  /tmp/rsh017.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/rsh017.patch.xz > /tmp/rsh017.patch

          awk '
            /^diff -ruN / {
              skip = ($0 ~ /\/\.github\/workflows\/rsh-017-source-transfer\.yml /)
            }
            !skip { print }
          ' /tmp/rsh017.patch > /tmp/rsh017.apply.patch
          test "$(grep -c '^diff -ruN ' /tmp/rsh017.apply.patch)" -eq 24

          git apply --check --whitespace=nowarn /tmp/rsh017.apply.patch
          git apply --whitespace=nowarn /tmp/rsh017.apply.patch

          rm -f \
            .github/workflows/rsh-017-source-transfer.yml \
            .rsh017-patch.part-* \
            .rsh017-overlay.part-* \
            RSH-017-SOURCE-HEAD.txt \
            RSH-017-SOURCE-TREE.txt

          node scripts/check-engine-adapters.mjs
          node scripts/check-world-builders.mjs
          node --test \
            scripts/check-engine-adapters.test.mjs \
            scripts/check-world-builders.test.mjs \
            scripts/program-control.test.mjs \
            scripts/milestone-register.test.mjs

          test ! -e .github/workflows/rsh-017-source-transfer.yml
          test -z "$(find . -maxdepth 1 -type f \( -name '.rsh017-patch.part-*' -o -name '.rsh017-overlay.part-*' \) -print -quit)"
          test ! -e RSH-017-SOURCE-HEAD.txt
          test ! -e RSH-017-SOURCE-TREE.txt

      - name: Commit the exact RSH-017 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --short)"
          git commit -m "RSH-017: split engine into loop, rendering, physics and QA adapters"
          git push origin HEAD:refs/heads/agent/rsh-017-engine-adapters
