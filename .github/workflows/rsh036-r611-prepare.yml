name: rsh036-r611-prepare
on:
  push:
    branches: [agent/rsh-036-r611-validation-20260906]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: "--experimental-strip-types"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact transport and isolate verified old product source
        run: |
          python - <<'PY'
          import json,lzma,hashlib,os,subprocess
          from pathlib import Path
          raw=lzma.decompress(b''.join(Path(f'.r611-transfer-{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(raw).hexdigest()=='f57b9b5197d25626cc9f837b8a15eb728b9f848ce99046fb1b18b36057f9880f'
          payload=json.loads(raw)
          Path(os.environ['RUNNER_TEMP'],'r611.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',payload['base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==payload['base_tree']
          Path('scripts/ramp-surface-browser.mjs').write_text(payload['baseline_browser'])
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm run toolchain:verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Same actual mesh tests on old source must reproduce all50 bad surfaces and100 bad strips
        env:
          RAMP_OUTPUT: artifacts/ramp-legacy
        run: |
          mkdir -p artifacts
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/ramp-surface-browser.mjs --expect-legacy-mismatch 2>&1 | tee artifacts/ramp-legacy.log
          git diff --exit-code -- src public
      - name: Apply reviewed patch and assert the exact complete candidate tree
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          payload=json.loads(Path(os.environ['RUNNER_TEMP'],'r611.json').read_text())
          Path('scripts/ramp-surface-browser.mjs').unlink()
          patch=payload['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==payload['patch_sha256']
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==payload['tree']
          subprocess.run(['git','diff','--exit-code'],check=True)
          Path('artifacts/candidate-identity.json').write_text(json.dumps({'base':payload['base'],'tree':payload['tree'],'changed':payload['changed']}))
          PY
      - name: Verify generated inventory with locked parser without accepting drift
        run: |
          cp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          node scripts/dependency-closure.mjs --write
          cmp AYALON-DEPENDENCY-CLOSURE.json "$RUNNER_TEMP/inventory.json"
          git diff --exit-code
      - name: Governance and complete unit suite
        run: |
          node scripts/check-governance-contract.mjs
          set -o pipefail
          npm test 2>&1 | tee artifacts/unit-tests.tap
      - name: Lint without suppression
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Same actual mesh tests on repaired source
        env:
          RAMP_OUTPUT: artifacts/ramp-repaired
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/ramp-surface-browser.mjs 2>&1 | tee artifacts/ramp-repaired.log
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('artifacts/ramp-legacy/results.json').read_text())
          new=json.loads(Path('artifacts/ramp-repaired/results.json').read_text())
          assert old['recipe']==new['recipe']
          assert old['recipeSha256']==new['recipeSha256']
          assert old['colliderCount']==new['colliderCount']==546
          assert old['checkpointCount']==new['checkpointCount']==8
          PY
      - name: Readiness fixtures
        run: node scripts/golden-capture-browser.mjs
      - name: Full QA and locked typecheck
        run: |
          set -o pipefail
          npm run qa:ci 2>&1 | tee artifacts/qa-ci.log
      - name: All retained actual runtime regressions plus ramp conformance
        run: |
          set -o pipefail
          node scripts/run-with-server.mjs -- node scripts/runtime-recovery-smoke.mjs 2>&1 | tee artifacts/runtime-recovery.log
      - name: Safe Ayalon capture and steering without reference updates
        run: |
          set -o pipefail
          npm run qa:ayalon 2>&1 | tee artifacts/ayalon-capture.log
      - name: Development build
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee artifacts/build-dev.log
      - name: Store validated unreferenced tree objects only, no commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          payload=json.loads(Path(os.environ['RUNNER_TEMP'],'r611.json').read_text())
          subprocess.run(['git','diff','--exit-code'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==payload['tree']
          entries=[]
          for name in payload['changed']:
            assert not name.startswith(('.github/','.r611','/')) and '..' not in Path(name).parts
            entries.append({'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()})
          data=json.dumps({'base_tree':payload['base_tree'],'tree':entries}).encode()
          req=urllib.request.Request('https://api.github.com/repos/talstilkol/rush-israel/git/trees',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response: result=json.load(response)
          assert result['sha']==payload['tree']
          Path('artifacts/prepared-tree.json').write_text(json.dumps({'tree':result['sha'],'ref_writes':0,'commit_writes':0,'merges':0}))
          print('Validated unreferenced tree:',result['sha'])
          PY
      - name: Original golden comparison with unchanged images and thresholds
        run: |
          set -o pipefail
          npm run qa:golden 2>&1 | tee artifacts/golden.log
      - name: Retain actual evidence including any golden failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rsh036-r611-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            golden-tmp/**
          if-no-files-found: error
          retention-days: 14
