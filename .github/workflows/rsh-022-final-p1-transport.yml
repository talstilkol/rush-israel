name: rsh-022-final-p1-transport

on:
  push:
    branches:
      - agent/rsh-022-save-recovery

permissions:
  contents: write

concurrency:
  group: rsh-022-final-p1-transport
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'RSH-022 transport: stage final pending-write correction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact transport commit
        uses: actions/checkout@v4
        with:
          ref: agent/rsh-022-save-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, apply and publish final clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "839f77daa394e10955c811fb37535c5d4f6f1854"
          echo "719d5a5c1b261834bc40a9cb9289dc38fc6166d30ab4a32ab267d9b25583b3fb  .rsh022-final-p1.patch.gz.b64" | sha256sum --check --strict
          base64 --decode .rsh022-final-p1.patch.gz.b64 > /tmp/rsh022-final-p1.patch.gz
          echo "669a2e2a639102d3d6a70922e3235278803d1db6abe6ffceae2d825cb6684384  /tmp/rsh022-final-p1.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/rsh022-final-p1.patch.gz > /tmp/rsh022-final-p1.patch
          echo "da4ebf33564cf7bbf08e64756a9c0ca9cbac31534b94b9ed66ac4243bd92d28f  /tmp/rsh022-final-p1.patch" | sha256sum --check --strict
          git apply --check /tmp/rsh022-final-p1.patch
          git apply --index /tmp/rsh022-final-p1.patch
          git rm .github/workflows/rsh-022-final-p1-transport.yml .rsh022-final-p1.patch.gz.b64
          git diff --cached --check
          test "$(git write-tree)" = "00c1d346032d977362a3b903459ed7b5e23b5ec0"
          test -z "$(git diff --cached --name-only | grep -E '(^|/)RSH-023|rsh023|records-v2' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RSH-022: retain pending writes and retry safely"
          git push origin HEAD:agent/rsh-022-save-recovery
