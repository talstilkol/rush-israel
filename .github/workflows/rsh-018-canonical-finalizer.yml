name: rsh-018-canonical-finalizer

on:
  push:
    branches:
      - agent/rsh-018-game-app-decomposition
    paths:
      - .github/workflows/rsh-018-canonical-finalizer.yml

permissions:
  contents: write

concurrency:
  group: rsh-018-canonical-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - name: Check out exact staged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Decode and run canonical finalizer
        run: |
          cat .rsh018-finalizer/part-* > /tmp/rsh018.b64
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('/tmp/rsh018.b64').read_text(encoding='utf-8')
          decoded = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/rsh-018-finalize.mjs').write_bytes(decoded)
          PY
          node --check /tmp/rsh-018-finalize.mjs
          node /tmp/rsh-018-finalize.mjs

      - name: Remove temporary finalizer inputs
        run: |
          rm -rf .rsh018-finalizer
          rm -f .github/workflows/rsh-018-canonical-finalizer.yml

      - name: Run complete unit-test suite
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run complete self-starting QA
        run: npm run qa:ci

      - name: Build deterministic development bundle
        run: npm run build:dev

      - name: Commit validated RSH-018 authority
        run: |
          git config user.name "talstilkol"
          git config user.email "tal_stilkol@hotmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(rsh-018): finalize game-app decomposition"
          git push origin HEAD:agent/rsh-018-game-app-decomposition
