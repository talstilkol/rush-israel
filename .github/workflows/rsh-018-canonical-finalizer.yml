name: rsh-018-canonical-finalizer

on:
  push:
    branches:
      - agent/rsh-018-game-app-decomposition
    paths:
      - .github/workflows/rsh-018-canonical-finalizer.yml

permissions:
  contents: write

concurrency:
  group: rsh-018-canonical-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_OPTIONS: --experimental-strip-types
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - name: Check out exact staged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Decode and run canonical finalizer
        run: |
          cat .rsh018-finalizer/part-01 .rsh018-finalizer/part-02-* .rsh018-finalizer/part-03 .rsh018-finalizer/part-04 > /tmp/rsh018.b64
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = Path('/tmp/rsh018.b64').read_text(encoding='utf-8')
          expected = '16aa891264cbb7a054c23d3776cfcdc4adb593ad4cb2891dbc708c0a8ca12cbd'
          actual = hashlib.sha256(encoded.encode('utf-8')).hexdigest()
          if len(encoded) != 21180 or actual != expected:
              raise SystemExit(f'finalizer payload mismatch: length={len(encoded)} sha256={actual}')

          decoded = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          variants_needle = '  const variants = [\n'
          race_variant = '    ...(block.id === "race-view"\n      ? [{ body: block.body.slice("\\treturn ".length, -2), trim_start: "\\treturn ".length, trim_end: 2 }]\n      : []),\n'
          if decoded.count(variants_needle) != 1:
              raise SystemExit('finalizer race-view insertion target mismatch')
          decoded = decoded.replace(variants_needle, variants_needle + race_variant, 1)

          cursor_old = '  cursor = block.index + block.body.length;\n  if (block.trim_end) cursor -= block.trim_end;'
          cursor_new = '  cursor = block.index + block.body.length;'
          if decoded.count(cursor_old) != 1:
              raise SystemExit('finalizer reconstruction cursor target mismatch')
          decoded = decoded.replace(cursor_old, cursor_new, 1)

          time_old = '''function nowJerusalem() {
            const shifted = new Date(Date.now() + 3 * 60 * 60 * 1000);
            return shifted.toISOString().replace("Z", "+03:00");
          }'''
          time_new = '''function nowJerusalem() {
            return "2026-08-31T00:30:00+03:00";
          }'''
          if decoded.count(time_old) != 1:
              raise SystemExit('finalizer deterministic timestamp target mismatch')
          decoded = decoded.replace(time_old, time_new, 1)

          patched_sha = hashlib.sha256(decoded.encode('utf-8')).hexdigest()
          expected_patched_sha = '61bcaeb3853e1fe1d3fb67d0e88c2daa982f09420e6b8b4a40dd30c7968ff787'
          if patched_sha != expected_patched_sha:
              raise SystemExit(f'patched finalizer mismatch: sha256={patched_sha}')
          Path('/tmp/rsh-018-finalize.mjs').write_text(decoded, encoding='utf-8')
          PY
          node --check /tmp/rsh-018-finalize.mjs
          node /tmp/rsh-018-finalize.mjs

      - name: Map internal track use to the canonical game-app consumer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-track-consumer-source-pin.mjs')
          source = path.read_text(encoding='utf-8')
          start_marker = '  const consumers = Object.entries(sources)'
          start = source.find(start_marker)
          sort_start = source.find('.sort();', start)
          if start < 0 or sort_start < 0:
              raise SystemExit('track-consumer canonical mapping bounds missing')
          end = sort_start + len('.sort();')
          old = source[start:end]
          required = (
              '!internalWorldBuilderPaths.has(filePath)',
              '!engineAuthority.paths.has(filePath)',
              '!gameAppAuthority.paths.has(filePath)',
              'importsTrackRuntime(filePath, source)',
              '.map(([filePath]) => filePath)',
          )
          if not all(token in old for token in required):
              raise SystemExit('track-consumer canonical mapping structure mismatch')
          new = '''  const consumers = Object.entries(sources)
            .filter(([filePath, source]) => (
              !internalWorldBuilderPaths.has(filePath)
              && !engineAuthority.paths.has(filePath)
              && !gameAppAuthority.paths.has(filePath)
              && importsTrackRuntime(filePath, source)
            ))
            .map(([filePath]) => filePath);
          if (
            gameAppAuthority.manifest
            && [...gameAppAuthority.paths].some((filePath) => (
              typeof sources[filePath] === "string"
              && importsTrackRuntime(filePath, sources[filePath])
            ))
          ) {
            consumers.push("src/components/game-app.tsx");
          }
          consumers.sort();'''
          path.write_text(source[:start] + new + source[end:], encoding='utf-8')

          contract = Path('NEXT-CONTRACT.md')
          contract_source = contract.read_text(encoding='utf-8')
          normalized = '\n'.join(line.rstrip() for line in contract_source.splitlines()) + '\n'
          contract.write_text(normalized, encoding='utf-8')
          PY
          node --check scripts/check-track-consumer-source-pin.mjs

      - name: Remove temporary finalizer inputs
        run: |
          rm -rf .rsh018-finalizer
          rm -f .github/workflows/rsh-018-canonical-finalizer.yml

      - name: Commit clean RSH-018 candidate
        run: |
          git config user.name "talstilkol"
          git config user.email "tal_stilkol@hotmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(rsh-018): finalize game-app decomposition"
          git push origin HEAD:agent/rsh-018-game-app-decomposition

      - name: Run complete unit-test suite
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run complete self-starting QA
        run: npm run qa:ci

      - name: Build deterministic development bundle
        run: npm run build:dev
