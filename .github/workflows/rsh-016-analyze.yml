name: rsh-016-analyze

on:
  push:
    branches:
      - agent/rsh-016-track-builders
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsh-016-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message || '', '[rsh-016-analysis-output]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rsh-016-track-builders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: node scripts/rsh-016-analyze.mjs
      - name: Commit deterministic preflight
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RSH-016-WORLD-BUILDER-PREFLIGHT.json RSH-016-WORLD-BUILDER-PREFLIGHT.md RSH-016-CREATE-WORLD-PREFLIGHT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RSH-016: record world-builder preflight [rsh-016-analysis-output]"
          git push origin HEAD:agent/rsh-016-track-builders
